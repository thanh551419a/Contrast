const LEVEL_MEASURE = {
  EASY: { cx:6200, cy:560, ringScale:220, tolerance:30, Rmm:855, revealDuration:5.6, i:2, k:4, outerN:7, worldW:7050, label:'BÀI ĐO A' },
  HARD: { cx:6600, cy:520, ringScale:220, tolerance:22, Rmm:855, revealDuration:5.6, i:3, k:6, outerN:7, worldW:7350, label:'BÀI ĐO B' }
};
function levelMeasureConfig(){ return LEVEL_MEASURE[selectedLevel] || LEVEL_MEASURE.EASY; }

const add = (name, material, x,y,w,h, extra={}) => {
  const c = { id:nextId++, name, material, x,y,w,h, moving:false, dx:0,dy:0, ...extra };
  terrain.push(c);
  if(c.moving) movingPlatforms.push(c);
  return c;
};

function clearLevelGeometry(){
  terrain.length=0;
  checkpoints=[];
  nextId=1;
  grayLift=null;
  hardExitPlatform=null;
  hardPortal=null;
  movingPlatforms.length=0;
  editorSaws.length=0;
  newtonRails.length=0;
  newtonVestibule=null;
}

function addNewtonRail(name, material, targetX, measureIndex, opts){
  const w=opts.w, h=opts.h||24;
  const lowCenter=opts.lowCenter;
  const highCenter=opts.highCenter;
  const y=opts.y;
  const c=add(name,material,lowCenter-w*.5,y,w,h,{
    moving:true,
    lowX:lowCenter-w*.5,
    highX:highCenter-w*.5,
    lowY:y,
    highY:y,
    period:opts.period,
    phase:opts.phase||0,
    newtonRail:true,
    measureIndex,
    measureLabel:['K','I',"K'"][measureIndex],
    targetX,
    dockX:opts.dockX,
    aimTolerance:opts.aimTolerance||Math.max(14,w*.18)
  });
  newtonRails.push(c);
  return c;
}

function addNewtonOrbitRail(name,material,radius,opts={}){
  const cfg=opts.cfg||levelMeasureConfig();
  const w=opts.w||140, h=opts.h||22;
  const angle=Number.isFinite(opts.angle)?opts.angle:Math.PI;
  const cx=cfg.cx+Math.cos(angle)*radius;
  const cy=cfg.cy+Math.sin(angle)*radius;
  const c=add(name,material,cx-w*.5,cy-h*.5,w,h,{
    moving:true,
    newtonRail:true,
    newtonOrbitRail:true,
    orbitRole:opts.role||'K',
    orbitRadius:radius,
    orbitAngle0:angle,
    orbitAngle:angle,
    period:opts.period||9,
    orbitDirection:opts.direction||1,
    orbitLabel:opts.label||'',
    orbitLevel:opts.level||selectedLevel,
    materialCycle:opts.colorCycle?.materials?.length>1?['WHITE','GRAY','BLACK'].filter(m=>opts.colorCycle.materials.includes(m)):opts.materialCycle||null,
    materialStepDuration:opts.colorCycle?.materials?.length>1?Math.max(.3,Number(opts.colorCycle.seconds)||3):opts.materialStepDuration||0,
    materialCyclePhase:opts.materialCyclePhase||0,
    materialChangeIn:999,
    nextMaterial:null,
  });
  newtonRails.push(c);
  return c;
}

function addHardNewtonObstacle(name,cfg,radius,angle,w,h,kind='pylon'){
  const cx=cfg.cx+Math.cos(angle)*radius;
  const cy=cfg.cy+Math.sin(angle)*radius;
  return add(name,MAT.BLACK,cx-w*.5,cy-h*.5,w,h,{
    alwaysSolid:true,structural:true,newtonObstacle:true,newtonObstacleKind:kind
  });
}

function setupNewtonRails(level){
  newtonRails.length=0;
  const cfg=LEVEL_MEASURE[level];
  const t=newtonTargets(cfg);

  if(level==='EASY'){
    // EASY: readable fixed-color orbits. The same k-platform is used for K and K'.
    const ec=window.__CE_CONFIG__ ? (window.__CE_NEWTON_RAILS__||{}) : {};
    const railK=ec.K||{}, railI=ec.I||{};
    const clampRail=(v,fallback,min,max)=>Number.isFinite(+v) ? Math.max(min,Math.min(max,+v)) : fallback;
    const kWidth=clampRail(railK.width,96,48,170);
    const iWidth=clampRail(railI.width,88,48,170);
    addNewtonOrbitRail('E_ORBIT_K',MAT.WHITE,t.rk,{
      cfg,level:'EASY',role:'K',label:`k = ${cfg.k}`,w:window.__CE_CONFIG__?kWidth:154,h:22,
      period:clampRail(railK.period,10.8,3,30),
      colorCycle:railK.colorCycle||null,
      angle:clampRail(railK.angleDeg,180,0,360)*Math.PI/180,
      direction:railK.direction===-1?-1:1
    });
    addNewtonOrbitRail('E_ORBIT_I',MAT.GRAY,t.ri,{
      cfg,level:'EASY',role:'I',label:`i = ${cfg.i}`,w:window.__CE_CONFIG__?iWidth:136,h:20,
      period:clampRail(railI.period,8.6,3,30),
      colorCycle:railI.colorCycle||null,
      angle:clampRail(railI.angleDeg,234,0,360)*Math.PI/180,
      direction:railI.direction===-1?-1:1
    });
    return;
  }

  if(level==='HARD'){
    // HARD: opposite orbital directions, different angular speeds and deterministic
    // material shifts. The bar itself always stays horizontal.
    addNewtonOrbitRail('H_ORBIT_K',MAT.WHITE,t.rk,{
      cfg,level:'HARD',role:'K',label:`k = ${cfg.k}`,w:142,h:22,
      period:7.15,angle:Math.PI*1.02,direction:1
      // Thanh k giữ màu TRẮNG cố định để người chơi tập trung chọn K và canh K′.
    });
    addNewtonOrbitRail('H_ORBIT_I',MAT.GRAY,t.ri,{
      cfg,level:'HARD',role:'I',label:`i = ${cfg.i}`,w:126,h:20,
      period:9.25,angle:Math.PI*1.42,direction:-1,
      // Thanh i vẫn đổi màu, nhưng chậm hơn để có thời gian đọc nhịp và đổi pha.
      materialCycle:[MAT.GRAY,MAT.BLACK,MAT.WHITE],materialStepDuration:5.6,materialCyclePhase:.46
    });

    // Two blocker bars live INSIDE the Newton field, in the annulus between the i and k orbits.
    // They obstruct transfers between the two orbit lanes, but their radial placement leaves enough
    // clearance that neither moving rail physically intersects them during a full revolution.
    const midOrbit=(t.ri+t.rk)*.5;
    addHardNewtonObstacle('H_NEWTON_BARRIER_UPPER_LEFT',cfg,midOrbit,Math.PI*1.38,100,30,'barrierWide');
    addHardNewtonObstacle('H_NEWTON_BARRIER_LOWER_RIGHT',cfg,midOrbit,Math.PI*.38,100,30,'barrierWide');
  }
}


function setupEditorEasyLevel(){
  const design=window.__CE_CONFIG__;
  if(!design) return;
  const world=design.world||{};
  // Only canvas visibility matters. Editor levels have no rigid WORLD rectangle.
  // WORLD.w/h are derived bookkeeping sizes for legacy rendering; not collision bounds.
  const objects=design.terrain||[], nd0=design.newton||{cx:6200,cy:560};
  const farX=Math.max(1500,nd0.cx+850,...objects.map(o=>(+o.x||0)+(+o.w||0)),...(design.checkpoints||[]).map(c=>+c.x||0));
  const farY=Math.max(900,nd0.cy+850,...objects.map(o=>(+o.y||0)+(+o.h||0)),...(design.checkpoints||[]).map(c=>+c.feet||0));
  WORLD.w=Math.max(1650,Math.ceil(farX+250));
  WORLD.h=Math.max(950,Math.ceil(farY+250));
  WORLD.deathY=Number.isFinite(world.deathY)?world.deathY:1080;
  window.__CE_FREE_WORLD=true;
  clearLevelGeometry();
  const nd=design.newton||{};
  // Newton inherits exact original EASY appearance, optical equations and rail presets.
  LEVEL_MEASURE.EASY.cx=Number.isFinite(+nd.cx)?+nd.cx:6200;
  LEVEL_MEASURE.EASY.cy=Number.isFinite(+nd.cy)?+nd.cy:560;
  LEVEL_MEASURE.EASY.worldW=WORLD.w;
  // Exact physical dark-fringe radii are derived in darkRingRadiusWorld().
  // Editor never writes arbitrary rail radii; i/k are the source of truth.
  const ci=Math.max(1,Math.min(6,Math.round(+nd.i||2)));
  const ck=Math.max(ci+1,Math.min(7,Math.round(+nd.k||4)));
  LEVEL_MEASURE.EASY.i=ci;
  LEVEL_MEASURE.EASY.k=ck;
  LEVEL_MEASURE.EASY.outerN=7;
  LEVEL_MEASURE.EASY.ringScale=220;
  const railConfig=nd.rails||{};
  window.__CE_NEWTON_RAILS__={
    K:{...(railConfig.K||{})},I:{...(railConfig.I||{})}
  };
  const objectMap=new Map();
  for(const ob of (design.terrain||[])){
    if(!['WHITE','GRAY','BLACK','FIXED'].includes(ob.material)) continue;
    if(!(ob.w>0&&ob.h>0)) continue;
    const fixed=ob.material==='FIXED';
    const cc=ob.colorCycle&&ob.colorCycle.enabled!==false?ob.colorCycle:null;
    const colors=cc?.materials?.filter(m=>m==='WHITE'||m==='GRAY'||m==='BLACK')||[];
    const cycle=colors.length>1?{materials:['WHITE','GRAY','BLACK'].filter(m=>colors.includes(m)),seconds:Math.max(.3,Math.min(60,+cc.seconds||2))}:null;
    if(ob.kind==='saw'){
      const mt=ob.motion?.enabled!==false?ob.motion:null;
      editorSaws.push({id:String(ob.id||('SAW_'+editorSaws.length)),x:+ob.x,y:+ob.y,w:+ob.w,h:+ob.h,
        baseMaterial:ob.material,material:ob.material,colorCycle:cycle,cycleWarning:0,
        motion:mt&&mt.period>=.4?{dx:+mt.dx||0,dy:+mt.dy||0,period:+mt.period,phase:+mt.phase||0}:null,
        fromX:+ob.x,fromY:+ob.y});
      continue;
    }
    // V2.1 platform travel: move from this rectangle to the chosen endpoint.
    // Movement retains the original phase-dependent solid / passable collision.
    const mt=ob.motion && ob.motion.enabled!==false ? ob.motion:null;
    const extra=fixed?{alwaysSolid:true,structural:true}:{};
    // Legacy V2.3 kind is only a motion preset, never a separate collider type.
    if(mt && [mt.dx,mt.dy,mt.period,mt.phase].every(v=>Number.isFinite(+v))
          && +mt.period>=.4 && (Math.abs(+mt.dx)+Math.abs(+mt.dy)>0.001)){
      Object.assign(extra,{moving:true,lowX:+ob.x,highX:+ob.x + +mt.dx,
        lowY:+ob.y,highY:+ob.y + +mt.dy,period:+mt.period,phase:+mt.phase,motionStyle:(mt.style==='press'||ob.kind==='crusher')?'press':'smooth'});
      // The authored point is the start of the path, not a snapshot of phase position.
    }
    const ref=add(String(ob.id||('SHAPE_'+terrain.length)), fixed?MAT.BLACK:MAT[ob.material],
      +ob.x,+ob.y,+ob.w,+ob.h,extra);
    if(cycle){ref.colorCycle=cycle;ref.baseMaterial=ob.material;ref.cycleWarning=0;}
    objectMap.set(String(ob.id),ref);
  }
  // The source remains the authority for Newton's rendering and measuring behavior.
  const vx=nd.vestibuleId;
  newtonVestibule=objectMap.get(String(vx))||null;
  if(!newtonVestibule){
    newtonVestibule=terrain.find(t=>t.structural&&Math.abs((t.x+t.w*.5)-(LEVEL_MEASURE.EASY.cx-745))<180)||null;
  }
  setupNewtonRails('EASY');
  checkpoints=(design.checkpoints||[]).map((cp,i)=>({
    id:i,x:+cp.x,feet:+cp.feet,phase:Number.isFinite(+cp.phase)?+cp.phase:Math.PI/2,
    triggerX:Number.isFinite(+cp.triggerX)?+cp.triggerX:undefined,
    groundedFloorName:cp.groundedFloorName||undefined,
    zone:cp.zone||undefined,
    resetNewton:!!cp.resetNewton
  }));
  if(!checkpoints.length) checkpoints=[{id:0,x:150,feet:780,phase:Math.PI/2,triggerX:-1}];
  window.__CE_DOCK_ACTIVE=false;
  window.__CE_NEWTON_ORBIT_START__=nd.orbitStart==='dock'?'dock':'auto';
}

// ------------------------------------------------------------
// Math / optical state
// ------------------------------------------------------------
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
const lerp = (a,b,t) => a+(b-a)*t;
const approach = (v,target,amount) => v < target ? Math.min(target,v+amount) : Math.max(target,v-amount);
const smooth = (rate,dt) => 1-Math.exp(-rate*dt);

const TAU = Math.PI*2;
function wrapPhase(phi){
  phi %= TAU;
  return phi < 0 ? phi + TAU : phi;
}
function intensityForPhase(phase) {
  return clamp((1+Math.cos(phase))/2,0,1);
}
function stateFor(I) {
  if (I >= 0.78) return 'BRIGHT';
  if (I <= 0.22) return 'DARK';
  return 'TUNING';
}
function matches(material, I=player.intensity) {
  if (material===MAT.WHITE) return I>=0.78;
  if (material===MAT.BLACK) return I<=0.22;
  // GRAY is no longer a third stable state. It represents the continuous tuning regions between extrema.
  return I>0.22 && I<0.78;
}
function reactStrength(material,I=player.intensity) {
  if (material===MAT.WHITE) return clamp((I-0.62)/(0.78-0.62),0,1);
  if (material===MAT.BLACK) return clamp((0.38-I)/(0.38-0.22),0,1);
  // Gray reacts throughout the in-between tuning band, with a short visual lead-in near each boundary.
  return clamp(Math.min((I-0.16)/0.06,(0.84-I)/0.06),0,1);
}
function grayForIntensity(I, alpha=1, min=18, max=245) {
  const v=Math.round(lerp(min,max,clamp(I,0,1)));
  return `rgba(${v},${v},${v},${alpha})`;
}
function stateVisual(state=player.state){
  if(state==='BRIGHT') return {label:'SÁNG', relation:'CÙNG PHA', fill:'#f4f7f8', text:'#071019', edge:'#ffffff'};
  if(state==='DARK') return {label:'TỐI', relation:'NGƯỢC PHA', fill:'#0a0e13', text:'#eef3f6', edge:'#b8c2c9'};
  return {label:'ĐIỀU PHA', relation:'ĐANG LỆCH PHA', fill:'#596168', text:'#ffffff', edge:'#d1d8dc'};
}

const CONSOLE_DEBUG = true;
function consoleEvent(type, data={}){
  if(!CONSOLE_DEBUG) return;
  const snapshot={
    state:gameState,
    level:selectedLevel,
    testMode:TEST_MOVE.enabled,
    player:{x:+player.x.toFixed(1),y:+player.y.toFixed(1),vx:+player.vx.toFixed(1),vy:+player.vy.toFixed(1)},
    ...data
  };
  console.log(`[CONTRAST][${type}]`,snapshot);
}
console.info('[CONTRAST] Console diagnostics enabled · filter with: CONTRAST');

const prevent = new Set(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space']);
window.addEventListener('keydown', e => {
  consoleEvent('KEY_DOWN',{code:e.code,key:e.key,repeat:e.repeat,ctrl:e.ctrlKey,alt:e.altKey,shift:e.shiftKey,meta:e.metaKey});
  if (prevent.has(e.code)) e.preventDefault();
  if (!keys.has(e.code)) pressed.add(e.code);
  keys.add(e.code);
  ensureAudio();

  if (e.code==='KeyH' && !e.repeat && gameState!=='LEVEL_SELECT'){
    debug=!debug;
    consoleEvent('DEBUG_OVERLAY',{enabled:debug});
  }

  // T toggles mouse-driven test/free-move mode. No physics or collision runs while active.
  if(e.code==='KeyT' && !e.repeat && gameState==='PLAY'){
    setTestMode(!TEST_MOVE.enabled);
    pressed.delete('KeyT');
    keys.delete('KeyT');
    return;
  }

  if(gameState==='LEVEL_SELECT' && !e.repeat){
    if(e.code==='ArrowLeft'||e.code==='KeyA'||e.code==='ArrowUp'||e.code==='KeyW') menuIndex=(menuIndex+1)%2;
    if(e.code==='ArrowRight'||e.code==='KeyD'||e.code==='ArrowDown'||e.code==='KeyS') menuIndex=(menuIndex+1)%2;
    if(e.code==='Enter'||e.code==='Space') startLevel(menuIndexToLevel(menuIndex));
    return;
  }

  if(e.code==='Escape' && TEST_MOVE.enabled){
    setTestMode(false);
    return;
  }

  if(e.code==='Escape' && gameState!=='LEVEL_SELECT'){
    goToLevelSelect();
    return;
  }

  if (gameState==='COMPLETE' && e.code==='Enter') restartLevel();
}, {passive:false});

window.addEventListener('keyup', e => {
  consoleEvent('KEY_UP',{code:e.code,key:e.key});
  if (prevent.has(e.code)) e.preventDefault();
  keys.delete(e.code);
  if (!TEST_MOVE.enabled && gameState==='PLAY' && (e.code==='Space'||e.code==='KeyW') && player.vy < -180) player.vy *= 0.56;
}, {passive:false});

window.addEventListener('blur', () => {
  consoleEvent('WINDOW_BLUR');
  keys.clear();
  TEST_MOVE.dx=0;
  TEST_MOVE.dy=0;
});

function setTestMode(enabled){
  const requested=!!enabled;
  const before=TEST_MOVE.enabled;
  TEST_MOVE.enabled=requested && gameState==='PLAY';
  TEST_MOVE.dx=0;TEST_MOVE.dy=0;
  player.vx=0;player.vy=0;
  player.grounded=false;player.groundedOn=null;
  player.jumpBuffer=0;player.coyote=0;
  player.ghost.clear();

function rectsOverlap(a,b){ return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y; }
function expandedOverlap(a,b,pad=0){ return a.x < b.x+b.w+pad && a.x+a.w > b.x-pad && a.y < b.y+b.h+pad && a.y+a.h > b.y-pad; }

function isPassable(c) {
  if (c.alwaysSolid) return false;
  if (matches(c.material)) return true;
  if (player.ghost.has(c.id)) {
    if (rectsOverlap(player,c)) return true;
    player.ghost.delete(c.id);
  }
  return false;
}
function rememberGhosts() {
  for (const c of terrain) {
    if (!c.alwaysSolid && matches(c.material) && rectsOverlap(player,c)) player.ghost.add(c.id);
  }
}
function solidCandidates() { return terrain; }

function moveX(dx) {
  if (!dx) return;
  player.x += dx;
  for (const c of solidCandidates()) {
    if (isPassable(c) || !rectsOverlap(player,c)) continue;
    if (dx>0) player.x=c.x-player.w;
    else player.x=c.x+c.w;
    player.vx=0;
  }
}
function moveY(dy) {
  if (!dy) return;
  const beforeVy=player.vy;
  player.y += dy;
  player.grounded=false;
  player.groundedOn=null;
  for (const c of solidCandidates()) {
    if (isPassable(c) || !rectsOverlap(player,c)) continue;
    if (dy>0) {
      player.y=c.y-player.h;
      player.vy=0;
      player.grounded=true;
      player.groundedOn=c.id;
      if (!lastGrounded && beforeVy>190) landSound(beforeVy);
    } else if (dy<0) {
      player.y=c.y+c.h;
      player.vy=0;
    }
  }
}

function updateEditorCycles(){

  const cycle=c.colorCycle;if(!cycle)continue;
  const duration=Math.max(.3,cycle.seconds),seq=cycle.materials;
  const step=Math.floor(elapsed/duration),index=step%seq.length;
  c.material=seq[index];c.nextMaterial=seq[(index+1)%seq.length];
  c.materialChangeIn=duration-elapsed%duration;c.cycleWarning=c.materialChangeIn<=Math.min(.35,duration*.3);
 }
}
function editorSawMotion(){
 if(!window.__CE_CONFIG__)return;
 for(const s of editorSaws){s.prevX=s.x;s.prevY=s.y;const m=s.motion;if(!m)continue;
   const t=((elapsed/m.period+m.phase)%1+1)%1, f=(1-Math.cos(2*Math.PI*t))/2;
   s.x=s.fromX+m.dx*f;s.y=s.fromY+m.dy*f;

}
function editorSawTouch(s){

function editorSawCollisions(){

 for(const s of editorSaws){if(matches(s.material))continue;
  const endX=s.x,endY=s.y,startX=s.prevX??endX,startY=s.prevY??endY;
  const steps=Math.min(48,Math.max(1,Math.ceil(Math.hypot(endX-startX,endY-startY)/Math.max(6,Math.min(s.w,s.h)*.22))));
  let touched=false;
  for(let i=0;i<=steps;i++){const frac=i/steps;s.x=startX+(endX-startX)*frac;s.y=startY+(endY-startY)*frac;if(editorSawTouch(s)){touched=true;break}}
  s.x=endX;s.y=endY;

function drawEditorSaws(){

  const cx=worldToScreenX(s.x+s.w*.5),cy=worldToScreenY(s.y+s.h*.5),r=Math.min(s.w,s.h)*camera.zoom*.5;
  ctx.save();ctx.translate(cx,cy);ctx.rotate(elapsed*3.8);
  const color=s.material==='WHITE'?'#edf3fa':s.material==='GRAY'?'#929da9':'#192433';
  ctx.beginPath();for(let j=0;j<36;j++){const a=j*Math.PI*2/36-Math.PI/2,rad=r*(j%2?.78:1);j?ctx.lineTo(Math.cos(a)*rad,Math.sin(a)*rad):ctx.moveTo(Math.cos(a)*rad,Math.sin(a)*rad)}ctx.closePath();ctx.fillStyle=color;ctx.fill();
  ctx.strokeStyle=s.material==='WHITE'?'#36536c':'#d6e3f3';ctx.lineWidth=Math.max(1,2*camera.zoom);ctx.stroke();
  ctx.beginPath();ctx.arc(0,0,r*.58,0,Math.PI*2);ctx.strokeStyle=s.material==='BLACK'?'#8093ab':'#45627a';ctx.lineWidth=2*camera.zoom;ctx.stroke();
  ctx.beginPath();ctx.arc(0,0,r*.16,0,Math.PI*2);ctx.fillStyle=s.material==='WHITE'?'#45627a':'#d0dbe7';ctx.fill();ctx.restore();
  if(s.cycleWarning){const alpha=.55+.45*Math.sin(elapsed*27);ctx.save();ctx.globalAlpha=alpha;ctx.strokeStyle='#ffbd65';ctx.lineWidth=3*camera.zoom;ctx.beginPath();ctx.arc(cx,cy,r+5*camera.zoom,0,Math.PI*2);ctx.stroke();ctx.restore()}

function updateMovingPlatforms(dt) {
  if(!movingPlatforms.length) return;
  for(const c of movingPlatforms){
    const oldX=c.x, oldY=c.y;

    if(c.newtonOrbitRail){
      const cfg=LEVEL_MEASURE[c.orbitLevel]||levelMeasureConfig();
      const dir=Number.isFinite(c.orbitDirection)?c.orbitDirection:1;
      const period=Math.max(.1,c.period||9);
      const angle=c.orbitAngle0 + dir*(newtonOrbitClock/period)*TAU;
      c.orbitAngle=angle;
      const cx=cfg.cx+Math.cos(angle)*c.orbitRadius;
      const cy=cfg.cy+Math.sin(angle)*c.orbitRadius;
      c.x=cx-c.w*.5;
      c.y=cy-c.h*.5;

      if(Array.isArray(c.materialCycle) && c.materialCycle.length && c.materialStepDuration>0){
        const n=c.materialCycle.length;
        const p=((newtonOrbitClock/c.materialStepDuration)+c.materialCyclePhase)%n;
        const idx=Math.floor(p+n)%n;
        const frac=p-Math.floor(p);
        c.material=c.materialCycle[idx];
        c.nextMaterial=c.materialCycle[(idx+1)%n];
        c.materialChangeIn=(1-frac)*c.materialStepDuration;
      }
    }else{
      const phase=Number.isFinite(c.phase)?c.phase:0;
      const t=((elapsed/c.period)+phase)%1;
      // Both presets share one collision model. Press: 25% warn, 15% lunge,
      // 20% hold, 25% retreat, 15% rest. Percentages are fixed to keep the UI small.
      let s;
      if(c.motionStyle==='press'){
        c.motionWarning=t<.25;
        if(t<.25)s=0;
        else if(t<.40){const u=(t-.25)/.15;s=(1-Math.cos(Math.PI*u))/2;}
        else if(t<.60)s=1;
        else if(t<.85){const u=(t-.60)/.25;s=(1+Math.cos(Math.PI*u))/2;}
        else s=0;
      }else s=(1-Math.cos(t*Math.PI*2))/2;
      if(Number.isFinite(c.lowX)&&Number.isFinite(c.highX)) c.x=lerp(c.lowX,c.highX,s);
      if(Number.isFinite(c.lowY)&&Number.isFinite(c.highY)) c.y=lerp(c.lowY,c.highY,s);
    }

    c.dx=c.x-oldX;
    c.dy=c.y-oldY;
    const solidNow=c.alwaysSolid || !matches(c.material);
    if(player.groundedOn===c.id && solidNow && (!window.__CE_CONFIG__||c.newtonOrbitRail)){
      player.x+=c.dx;
      player.y+=c.dy;
    }
  }
}

// V2.3.1: ONE collision rule for all authored moving solid rectangles.
// Physics preset (smooth/press) changes the motion profile only. A solid
// rectangle carries, pushes and crushes independently of its preset/name.
let editorMovingPushes=0,editorMovingCrushDeaths=0,editorMovingCarries=0;
function editorBoxIsFree(box,self){
 for(const other of terrain){
  if(other===self||isPassable(other))continue;
  if(rectsOverlap(box,other))return false;
 }
 return true;
}
function editorPathIsFree(from,to,self){
 const corridor={x:Math.min(from.x,to.x),y:Math.min(from.y,to.y),
  w:from.w+Math.abs(to.x-from.x),h:from.h+Math.abs(to.y-from.y)};
 return editorBoxIsFree(corridor,self)&&editorBoxIsFree(to,self);
}
function editorResolveMovingSolids(){
 if(!window.__CE_CONFIG__||gameState!=='PLAY'||TEST_MOVE.enabled)return;
 const active=movingPlatforms.filter(c=>!c.newtonOrbitRail&&!isPassable(c));
 // 1) Carry first. Vertical lifts and horizontal transports both have to check
 // the corridor against real walls. This prevents ghosting into a ceiling.
 const carrier=active.find(c=>player.groundedOn===c.id);
 if(carrier&&(Math.abs(carrier.dx)+Math.abs(carrier.dy)>1e-8)){
  const proposed={x:player.x+carrier.dx,y:player.y+carrier.dy,w:player.w,h:player.h};
  if(!editorPathIsFree(player,proposed,carrier)){
   editorMovingCrushDeaths++;editorCrusherDeaths++;die();return;
  }
  player.x=proposed.x;player.y=proposed.y;
  editorMovingCarries++;
 }
 // 2) Side/head contact. Resolve against the CURRENT position of all other
 // solid geometry, including the opposing moving wall. Sweep the mover to
 // catch fast edges between physics ticks; never teleport through a blocker.
 for(const c of active){
  if(c===carrier)continue;
  const dx=c.dx||0,dy=c.dy||0;
  if(Math.abs(dx)+Math.abs(dy)<1e-8)continue;
  const oldX=c.x-dx,oldY=c.y-dy;
  if(!rectsOverlap(player,c)){
   const swept={x:Math.min(oldX,c.x),y:Math.min(oldY,c.y),w:c.w+Math.abs(dx),h:c.h+Math.abs(dy)};
   if(!rectsOverlap(player,swept))continue;
   let touched=false;
   const samples=Math.min(160,Math.max(2,Math.ceil(Math.hypot(dx,dy)/5)));
   for(let j=1;j<=samples;j++){
    const b={x:oldX+dx*j/samples,y:oldY+dy*j/samples,w:c.w,h:c.h};
    if(rectsOverlap(player,b)){touched=true;break;}
   }
   if(!touched)continue;
  }
  const exits=[];
  if(Math.abs(dx)>1e-7)exits.push({axis:'x',distance:dx>0?c.x+c.w-player.x:c.x-player.x-player.w});
  if(Math.abs(dy)>1e-7)exits.push({axis:'y',distance:dy>0?c.y+c.h-player.y:c.y-player.y-player.h});
  exits.sort((a,b)=>Math.abs(a.distance)-Math.abs(b.distance));
  let resolved=false;
  for(const e of exits){
   const proposed={x:player.x,y:player.y,w:player.w,h:player.h};
   proposed[e.axis]+=e.distance;
   if(rectsOverlap(proposed,c))continue;
   if(!editorPathIsFree(player,proposed,c))continue;
   player.x=proposed.x;player.y=proposed.y;
   if(e.axis==='x')player.vx=0;
   else{player.vy=0;player.grounded=false;player.groundedOn=null;}
   editorMovingPushes++;editorCrusherPushes++;resolved=true;break;
  }
  if(!resolved){editorMovingCrushDeaths++;editorCrusherDeaths++;die();return;}
 }
}

  const cfg=levelMeasureConfig();

  return cx>=cfg.cx-cfg.ringScale*3.15 && cx<=cfg.cx+cfg.ringScale*3.25;
}
function railMaterialName(rail){
  return rail ? rail.material : '—';
}
function newtonMarker(label){ return newtonMarkers.find(m=>m.label===label)||null; }
function orbitNewtonGeometry(cfg=levelMeasureConfig()){
  const K=newtonMarker('K');
  if(!K) return null;
  const theta=Number.isFinite(K.angle)?K.angle:Math.atan2(K.y-cfg.cy,K.x-cfg.cx);
  const ux=Math.cos(theta), uy=Math.sin(theta);
  const ri=darkRingRadiusWorld(cfg.i,cfg), rk=darkRingRadiusWorld(cfg.k,cfg);
  return {
    theta,ux,uy,ri,rk,
    K:{x:cfg.cx+ux*rk,y:cfg.cy+uy*rk},
    I:{x:cfg.cx-ux*ri,y:cfg.cy-uy*ri},
    Kp:{x:cfg.cx-ux*rk,y:cfg.cy-uy*rk},
  };
}
function easyNewtonGeometry(){ return orbitNewtonGeometry(LEVEL_MEASURE.EASY); }
function hardNewtonGeometry(){ return orbitNewtonGeometry(LEVEL_MEASURE.HARD); }
function railCenterPoint(rail){
  return rail?{x:rail.x+rail.w*.5,y:rail.y+rail.h*.5}:null;
}
function pointDistance(a,b){ return Math.hypot(a.x-b.x,a.y-b.y); }

function newtonMeasurementResult(){
  if(newtonMarkers.length<3) return null;
  const cfg=levelMeasureConfig();
  const K=newtonMarker('K'), I=newtonMarker('I'), Kp=newtonMarker("K'");
  if(!K||!I||!Kp) return null;
  const hasXY=[K,I,Kp].every(m=>Number.isFinite(m.x)&&Number.isFinite(m.y));
  const Bpx=hasXY?Math.hypot(I.x-K.x,I.y-K.y):Math.abs(I.measuredX-K.measuredX);
  const bpx=hasXY?Math.hypot(Kp.x-I.x,Kp.y-I.y):Math.abs(Kp.measuredX-I.measuredX);
  const lambdaMm=SOURCE_LAMBDA*1e-6;
  const physicalR1=Math.sqrt(lambdaMm*cfg.Rmm);
  const mmPerPx=physicalR1/cfg.ringScale;
  const Bmm=Bpx*mmPerPx, bmm=bpx*mmPerPx;
  const lambdaOutMm=(Bmm*bmm)/(Math.abs(cfg.k-cfg.i)*cfg.Rmm);
  return {Bpx,bpx,Bmm,bmm,lambdaNm:lambdaOutMm*1e6};
}
function beginNewtonReveal(){
  if(!(selectedLevel==='EASY'||selectedLevel==='HARD')) return;
  consoleEvent('NEWTON_MEASUREMENT_COMPLETE',{marks:newtonMarkers.map(m=>m.label)});

function lockOrbitNewtonPoint(label,target,rail,extra={}){
  newtonMarkers.push({
    label,x:target.x,y:target.y,measuredX:target.x,targetX:target.x,
    rail:rail?.name||null,...extra
  });
  newtonFeedbackText=label==='K'?'K ĐÃ KHÓA · TRỤC K–O ĐƯỢC XÁC LẬP':`${label} ĐÃ KHÓA`;
  newtonFeedbackTimer=1.15;
  newtonMissCount=0;
  measurementLockSound(newtonMeasurementStep);
  screenPulse=Math.max(screenPulse,label==='K'?.24:.16);
  consoleEvent('NEWTON_LOCK',{label,x:+target.x.toFixed(1),y:+target.y.toFixed(1),rail:rail?.name||null});
  newtonMeasurementStep++;
  if(newtonMeasurementStep>=3) beginNewtonReveal();
}

function fireEasyNewtonMeasurementPulse(){
  const cfg=LEVEL_MEASURE.EASY;
  const current=currentNewtonRail();
  const expected=expectedNewtonRail();
  const labels=['K','I',"K'"];
  const label=labels[newtonMeasurementStep];

  newtonShotPulse=.28;
  measurementPulseSound();
  consoleEvent('NEWTON_SHOT',{step:newtonMeasurementStep,label,currentRail:current?.name||null});

  if(!current || current.id!==expected?.id){
    const need=newtonMeasurementStep===1?`thanh i = ${cfg.i}`:`thanh k = ${cfg.k}`;
    newtonFeedbackText=`HÃY ĐỨNG TRÊN ${need}`;
    newtonFeedbackTimer=1.0;
    newtonMissCount++;
    measurementMissSound();
    return;
  }

  // Step 1: K is intentionally NOT predetermined. Wherever the player chooses to press X
  // on the k-platform becomes K and fixes the diameter K-O-K'.
  if(newtonMeasurementStep===0){
    const angle=current.orbitAngle;
    const target={
      x:cfg.cx+Math.cos(angle)*current.orbitRadius,
      y:cfg.cy+Math.sin(angle)*current.orbitRadius,
    };
    easyNewtonAxisAngle=angle;
    easyNewtonAxisLockedAt=elapsed;
    lockOrbitNewtonPoint('K',target,current,{angle});
    return;
  }

  const geo=easyNewtonGeometry();
  if(!geo) return;
  const target=newtonMeasurementStep===1?geo.I:geo.Kp;
  const center=railCenterPoint(current);
  const error=pointDistance(center,target);
  // Generous EASY timing window: the skill is reading the orbit + axis, not pixel-perfect aiming.
  const tolerance=newtonMeasurementStep===1?48:54;
  if(error<=tolerance){
    const accuracy=Math.max(0,Math.round(100*(1-error/tolerance)));
    lockOrbitNewtonPoint(label,target,current,{angle:Math.atan2(target.y-cfg.cy,target.x-cfg.cx),accuracy});
    newtonFeedbackText=`${label} ĐÃ KHÓA · ${accuracy}%`;
  }else{
    newtonFeedbackText=`CHỜ ${label} THẲNG HÀNG VỚI TRỤC K–O`;
    newtonFeedbackTimer=.95;
    newtonMissCount++;
    measurementMissSound();
    consoleEvent('NEWTON_MISS',{label,error:+error.toFixed(1),tolerance});
  }
}


function fireHardNewtonMeasurementPulse(){

  if(!current || current.id!==expected?.id){

    newtonFeedbackText=`HÃY ĐỨNG TRÊN ${need}`;
    newtonFeedbackTimer=1.0;
    newtonMissCount++;

  // K is still the player's strategic choice. Once fired, the diameter is permanent.
  if(newtonMeasurementStep===0){

  // HARD tightens timing, but remains intentionally larger than a tiny hitbox.

  if(error<=tolerance){
    const accuracy=Math.max(0,Math.round(100*(1-error/tolerance)));
    lockOrbitNewtonPoint(label,target,current,{angle:Math.atan2(target.y-cfg.cy,target.x-cfg.cx),accuracy});

function fireNewtonMeasurementPulse(){
  if(gameState!=='PLAY' || newtonMeasurementStep>2) return;
  newtonMeasurementStarted=true;
  if(selectedLevel==='EASY'){
    fireEasyNewtonMeasurementPulse();
    return;
  }
  if(selectedLevel==='HARD'){
    fireHardNewtonMeasurementPulse();
    return;
  }

  // Legacy fallback.
  const cfg=levelMeasureConfig();
  const targets=newtonTargets(cfg);
  const targetList=[targets.K.x,targets.I.x,targets.Kp.x];
  const labels=['K','I',"K'"];
  const rail=expectedNewtonRail();
  const current=currentNewtonRail();
  const label=labels[newtonMeasurementStep];

  newtonShotPulse=.28;
  measurementPulseSound();
  if(!rail || current?.id!==rail.id){
    newtonFeedbackText=`HÃY DÙNG THANH ${railMaterialName(rail)} ĐỂ ĐÁNH DẤU ${label}`;
    newtonFeedbackTimer=1.05;
    newtonMissCount++;
    measurementMissSound();
    return;
  }
  const targetX=targetList[newtonMeasurementStep];
  const railCenter=rail.x+rail.w*.5;
  const railStationError=Math.abs(railCenter-rail.dockX);
  const bodyError=Math.abs(newtonProjectionX()-railCenter);
  const railDockTolerance=Math.max(14,cfg.tolerance*.72);
  if(railStationError>railDockTolerance){
    newtonFeedbackText=`CHỜ THANH ${rail.material} VÀO ĐÚNG VỊ TRÍ`;
    newtonFeedbackTimer=.9;newtonMissCount++;measurementMissSound();return;
  }
  if(bodyError<=rail.aimTolerance){
    const accuracy=Math.max(0,Math.round(100*(1-bodyError/rail.aimTolerance)));
    newtonMarkers.push({label,measuredX:targetX,targetX,rail:rail.name});
    newtonFeedbackText=`${label} ĐÃ KHÓA · ${accuracy}%`;newtonFeedbackTimer=1.0;newtonMissCount=0;
    measurementLockSound(newtonMeasurementStep);screenPulse=Math.max(screenPulse,.16);newtonMeasurementStep++;
    if(newtonMeasurementStep>=3) beginNewtonReveal();
  }else{
    newtonFeedbackText='ĐỨNG VÀO GIỮA THANH';newtonFeedbackTimer=.85;newtonMissCount++;measurementMissSound();
  }
}

// ------------------------------------------------------------
// Core update
// ------------------------------------------------------------
function update(dt){
  elapsed+=dt;
  hintTimer+=dt;
  screenPulse=Math.max(0,screenPulse-dt*1.8);
  checkpointFlash=Math.max(0,checkpointFlash-dt*1.2);
  shotPulse=Math.max(0,shotPulse-dt);
  missTimer=Math.max(0,missTimer-dt);
  fringeHintTimer=Math.max(0,fringeHintTimer-dt);
  lockFeedbackTimer=Math.max(0,lockFeedbackTimer-dt);
  newtonFeedbackTimer=Math.max(0,newtonFeedbackTimer-dt);
  newtonShotPulse=Math.max(0,newtonShotPulse-dt);
  const tunerTargetX=isNewtonFramingActive()?newtonViewLayout().tunerX:(V.w-500)/2;
  tunerPanelX=lerp(tunerPanelX,tunerTargetX,smooth(7.5,dt));

  if(gameState==='LEVEL_SELECT'){ updateAudio(); pressed.clear(); return; }

  // Newton orbit motion wakes up only near the chamber. This keeps the opening
  // composition deterministic while allowing HARD to use the same physical orbit model.
  if((selectedLevel==='EASY'||selectedLevel==='HARD') && gameState==='PLAY'){
    const cfg=levelMeasureConfig();
    const px=player.x+player.w*.5;
    const wakeX=selectedLevel==='EASY'?5250:(cfg.cx-cfg.ringScale*4.55);
    if(selectedLevel==='EASY' && window.__CE_CONFIG__){
      // Editor maps offer two explicit orbit-start modes.
      // AUTO: K and I rotate as soon as Playtest begins (default).
      // DOCK: both wait until the player FIRST stands on K, for guided L01 layouts.
      const mode=window.__CE_NEWTON_ORBIT_START__||'auto';
      if(mode==='dock'){
        const onK=newtonRails.some(r=>r.id===player.groundedOn&&r.orbitRole==='K');
        if(onK) window.__CE_DOCK_ACTIVE=true;
        if(window.__CE_DOCK_ACTIVE) newtonOrbitClock+=dt;
      }else{
        window.__CE_DOCK_ACTIVE=true;
        newtonOrbitClock+=dt;
      }
    } else if(newtonOrbitClock>0 || px>wakeX) newtonOrbitClock+=dt;
  }
  updateEditorCycles();
  updateMovingPlatforms(dt);
  editorSawMotion();
  updateParticles(dt);

  if(gameState==='DYING'){
    deathTimer-=dt;
    if(deathTimer<=0) respawn();
    updateCamera(dt); updateAudio(); pressed.clear(); return;
  }
  if(gameState==='LENS_TRANSITION'){
    lensTransitionTimer+=dt;
    updateLensCamera(dt);
    updateAudio();
    if(lensTransitionTimer>=2.45) beginMeasurement();
    pressed.clear(); return;
  }
  if(gameState==='MEASUREMENT'){
    measurementIntroTimer+=dt;
    const move=((keys.has('KeyD')||keys.has('ArrowRight'))?1:0)-((keys.has('KeyA')||keys.has('ArrowLeft'))?1:0);
    // Constant scanner speed is deliberate: it makes microscope-style positioning precise and accessible.
    reticleVX=move*MEASURE.reticleSpeed;
    reticleX=clamp(reticleX+reticleVX*dt,MEASURE.axisMin,MEASURE.axisMax);
    if(pressed.has('Space')) fireMeasurementPulse();
    updateAudio(); pressed.clear(); return;
  }
  if(gameState==='MEASUREMENT_RESULT'){
    measurementResultTimer+=dt;
    if(measurementResultTimer>=3.0) finishComplete();
    updateAudio(); pressed.clear(); return;
  }
  if(gameState==='NEWTON_REVEAL'){
    newtonRevealTimer+=dt;
    updateNewtonRevealCamera(dt);
    if(newtonRevealTimer>=levelMeasureConfig().revealDuration) finishComplete();
    updateAudio(); pressed.clear(); return;
  }
  if(gameState==='COMPLETE'){
    completeTimer+=dt; updateAudio(); pressed.clear(); return;
  }

  // PLAY: relative phase tuning is CYCLIC. There are no endpoints.
  // Holding either arrow keeps sliding Wave B forever: BRIGHT -> TUNING -> DARK -> TUNING -> BRIGHT -> ...
  tuneDir=(keys.has('ArrowRight')?1:0)-(keys.has('ArrowLeft')?1:0);
  if(tuneDir) player.phase=wrapPhase(player.phase+tuneDir*CFG.phaseSpeed*dt);
  player.intensity=intensityForPhase(player.phase);
  player.state=stateFor(player.intensity);

  // TEST MODE: raw mouse displacement maps directly to world-space player displacement.
  // Physics, collision, checkpoints, death, measurement triggers, and completion triggers are bypassed.
  if(TEST_MOVE.enabled){
    const r=canvas.getBoundingClientRect();
    const scaleX=(V.w/Math.max(1,r.width))/Math.max(.001,camera.zoom);
    const scaleY=(V.h/Math.max(1,r.height))/Math.max(.001,camera.zoom);
    const dx=TEST_MOVE.dx*scaleX*TEST_MOVE.sensitivity;
    const dy=TEST_MOVE.dy*scaleY*TEST_MOVE.sensitivity;
    TEST_MOVE.dx=0;TEST_MOVE.dy=0;
    if(dx!==0) player.facing=dx>0?1:-1;
    player.x=window.__CE_FREE_WORLD?player.x+dx:clamp(player.x+dx,0,WORLD.w-player.w);
    player.y=window.__CE_FREE_WORLD?player.y+dy:clamp(player.y+dy,0,WORLD.h-player.h);
    player.vx=0;player.vy=0;
    player.grounded=false;player.groundedOn=null;
    player.jumpBuffer=0;player.coyote=0;
    player.trail.length=0;
    if(window.__CE_FREE_WORLD) editorLastSupportedFeet=player.y+player.h;
    updateCamera(dt);
    updateAudio();
    lastGrounded=false;
    pressed.clear();
    return;
  }

  editorResolveMovingSolids();
  if(gameState==='DYING'){updateCamera(dt);updateAudio();pressed.clear();return;}
  const move=(keys.has('KeyD')?1:0)-(keys.has('KeyA')?1:0);
  if(move){
    player.facing=move;
    const accel=(player.grounded?CFG.groundAccel:CFG.airAccel)*dt;
    player.vx=approach(player.vx,move*CFG.maxSpeed,accel);
  } else {
    const decel=(player.grounded?CFG.groundDecel:CFG.airAccel*.35)*dt;
    player.vx=approach(player.vx,0,decel);
  }

  if(!newtonMeasurementStarted){
    const px=player.x+player.w*.5;
    const cfg=levelMeasureConfig();
    const shouldStart=window.__CE_FREE_WORLD?editorNearNewton():px>cfg.cx-cfg.ringScale*4.25;
    if(shouldStart){
      newtonMeasurementStarted=true;
      consoleEvent('NEWTON_ZONE_ENTER',{step:newtonMeasurementStep});
    }
  }
  if(newtonMeasurementStarted && pressed.has('KeyX') && newtonMeasurementStep<3) fireNewtonMeasurementPulse();
  if(gameState==='NEWTON_REVEAL'){ updateAudio(); pressed.clear(); return; }

  // SPACE/W are jump only. X is exclusively the Newton mark/shot input.
  const wantsJump=pressed.has('KeyW') || pressed.has('Space');
  if(wantsJump) player.jumpBuffer=CFG.jumpBuffer;
  else player.jumpBuffer=Math.max(0,player.jumpBuffer-dt);
  if(player.grounded) player.coyote=CFG.coyote;
  else player.coyote=Math.max(0,player.coyote-dt);

  if(player.jumpBuffer>0 && player.coyote>0){
    player.vy=CFG.jumpVel; player.grounded=false; player.groundedOn=null; player.coyote=0; player.jumpBuffer=0; ping(250,.055,.015);
  }

  if(keys.has('KeyS')) player.vy=Math.min(CFG.maxFall,player.vy+900*dt);
  player.vy=Math.min(CFG.maxFall,player.vy+CFG.gravity*dt);

  moveX(player.vx*dt);
  moveY(player.vy*dt);
  rememberGhosts();

  for(const c of terrain){
    if(!c.alwaysSolid && matches(c.material) && rectsOverlap(player,c) && !c._wasOverlap){
      c._wasOverlap=true; screenPulse=Math.max(screenPulse,.18); phaseSound();
      editorSpawnPhasePassRipple(c);
    } else if(!rectsOverlap(player,c)) c._wasOverlap=false;
  }

  spawnTrail();
  updateCheckpoint();
  editorSawCollisions();
  updateHardNewtonBiteCollision();
  if(window.__CE_FREE_WORLD ? editorShouldDieFromVoid() : (player.y>WORLD.deathY)) die();

  updateCamera(dt);
  updateAudio();
  lastGrounded=player.grounded;
  pressed.clear();
}

function editorNearNewton(){
  const cfg=levelMeasureConfig();
  const px=player.x+player.w*.5, py=player.y+player.h*.5;
  return Math.hypot(px-cfg.cx,py-cfg.cy) < cfg.ringScale*4.6;
}
function isNewtonFramingActive(){
  if(TEST_MOVE.enabled || !(selectedLevel==='EASY'||selectedLevel==='HARD')) return false;
  if(gameState==='NEWTON_REVEAL') return true;
  if(gameState!=='PLAY' && gameState!=='DYING') return false;
  const cfg=levelMeasureConfig();
  const centerX=player.x+player.w*.5;
  if(window.__CE_FREE_WORLD) return editorNearNewton();
  return centerX>cfg.cx-cfg.ringScale*3.7;
}

function newtonViewLayout(cfg=levelMeasureConfig()){
  const tunerW=500, tunerH=142;
  const tunerX=38;
  const tunerY=V.h-tunerH-18;

  // Put the Newton system slightly to the right so the player/approach and tuner own the left side.
  const centerSX=V.w*.625;
  const centerSY=V.h*.5;

  // Fit against the REAL outer optical system (fringe + mount), not an arbitrary hard-coded zoom.
  const outerWorld=darkRingRadiusWorld(cfg.outerN+.65,cfg)+22;
  const edgePad=8;
  let maxRadius=Math.min(
    centerSX-edgePad,
    V.w-centerSX-edgePad,
    centerSY-edgePad,
    V.h-centerSY-edgePad

  // Keep the bottom-left tuner rectangle outside the circle with a small visual gap.
  const tunerGap=22;
  const nearestTunerX=tunerX+tunerW+tunerGap;
  const nearestTunerY=tunerY;
  const dx=Math.max(0,centerSX-nearestTunerX);
  const dy=Math.max(0,nearestTunerY-centerSY);
  maxRadius=Math.min(maxRadius,Math.hypot(dx,dy));

  const zoom=clamp(maxRadius/outerWorld,.58,.74);
  return {centerSX,centerSY,zoom,tunerX,tunerY};
}

function cameraForWorldPoint(worldX,worldY,screenX,screenY,zoom){
  const ox=(V.w-V.w*zoom)*.5;
  const oy=(V.h-V.h*zoom)*.5;
  return {
    x:worldX-(screenX-ox)/zoom,
    y:worldY-(screenY-oy)/zoom
  };
}


// EDITOR: brief contact ripples make phase-passage through floors easy to read.
const editorPhasePassRipples=[];
function editorSpawnPhasePassRipple(c){
  if(!window.__CE_CONFIG__ || c.alwaysSolid || player.vy<0) return;
  const x=clamp(player.x+player.w*.5,c.x+3,c.x+c.w-3);
  const y=clamp(player.y+player.h,c.y,c.y+c.h);
  editorPhasePassRipples.push({x,y,born:elapsed});
  if(editorPhasePassRipples.length>18)editorPhasePassRipples.shift();
}
function drawEditorPhasePassRipples(){
  if(!window.__CE_CONFIG__ || !editorPhasePassRipples.length) return;
  const now=elapsed;
  ctx.save();
  for(const ripple of editorPhasePassRipples){
    const age=now-ripple.born;
    if(age<0 || age>.64) continue;
    const k=1-age/.64, x=worldToScreenX(ripple.x), y=worldToScreenY(ripple.y);
    const spread=(13+age*92)*camera.zoom;
    ctx.globalAlpha=.82*k;
    ctx.strokeStyle='rgba(197,226,255,.98)';
    ctx.lineWidth=Math.max(1,2.2*camera.zoom*k);
    ctx.beginPath();ctx.ellipse(x,y,spread,Math.max(3,spread*.18),0,0,Math.PI*2);ctx.stroke();
    ctx.globalAlpha=.46*k;
    ctx.strokeStyle='#f4f8ff';
    ctx.beginPath();ctx.ellipse(x,y,spread*.70,Math.max(2.5,spread*.10),0,0,Math.PI*2);ctx.stroke();
  }

}
// EDITOR ONLY: fall-to-void, without a fixed world boundary or author-painted kill zone.
// A long drop is legal whenever there is still a plausible platform to land on below.
// Allow a generous steering margin, and treat all material colors as possible landings:
// the player may tune phase mid-air before reaching one. No automatic invisible floor.
let editorLastSupportedFeet=780;
const EDITOR_VOID_GRACE_PX=560; // do not confuse an ordinary jump with falling into the void
// A matching (passable) lower floor must be crossed completely before a void death.
// The previous rule killed inside a lower Black plank whenever its top was near
// the grace distance from the upper floor (e.g. L03: 780 -> 1334).
function editorRememberPassedFloors(){
  if(!window.__CE_FREE_WORLD || player.vy<0) return;
  for(const c of terrain){
    if(c.alwaysSolid || c.newtonObstacle || c.w<=0 || c.h<=0) continue;
    if(!matches(c.material) || !rectsOverlap(player,c)) continue;
    // Count the physical bottom of the most recently crossed phase-matched floor.
    // Death will occur only after falling a further gap beyond this bottom.
    editorLastSupportedFeet=Math.max(editorLastSupportedFeet,c.y+c.h);
  }
}
function editorPotentialLandingBelow(){
  const feet=player.y+player.h;
  const left=player.x, right=player.x+player.w;
  for(const t of terrain){
    if(t.newtonObstacle) continue; // obstacles aren't landings
    if(t.w<=0||t.h<=0) continue;
    const deltaY=t.y-feet;
    if(deltaY < -2) continue; // already passed the top of this platform
    // Optimistic free-fall time + cushion for acceleration/steering from rest.
    const airborneTime=Math.sqrt(2*Math.max(0,deltaY)/CFG.gravity)+.28;
    const horizontalReach=Math.max(210,CFG.maxSpeed*airborneTime)+player.w;
    if(t.x <= right+horizontalReach && t.x+t.w >= left-horizontalReach) return true;
  }
  return false;
}
function editorShouldDieFromVoid(){
  if(player.grounded){ editorLastSupportedFeet=player.y+player.h; return false; }
  if(player.vy<0) return false; // rising after a jump
  editorRememberPassedFloors();
  const feet=player.y+player.h;
  if(feet-editorLastSupportedFeet<EDITOR_VOID_GRACE_PX) return false;
  return !editorPotentialLandingBelow();
}
function editorCameraLimit(value,axis){
  if(window.__CE_FREE_WORLD)return value;
  return clamp(value,0,axis==='x'?Math.max(0,WORLD.w-V.w):Math.max(0,WORLD.h-V.h));
}

function updateCamera(dt){
  const centerX=player.x+player.w*.5;
  const centerY=player.y+player.h*.5;

  if(TEST_MOVE.enabled){
    // Pointer-lock test mode: keep the player at the screen center and roll the map underneath.
    camera.targetZoom=1;
    camera.zoom=1;
    camera.x=editorCameraLimit(centerX-V.w*.5,'x');
    camera.y=editorCameraLimit(centerY-V.h*.5,'y');
    return;
  }

  const cfg=levelMeasureConfig();
  const inMeasureZone=isNewtonFramingActive();
  if(inMeasureZone){
    const layout=newtonViewLayout(cfg);
    const targetCam=cameraForWorldPoint(cfg.cx,cfg.cy,layout.centerSX,layout.centerSY,layout.zoom);
    camera.x=lerp(camera.x,editorCameraLimit(targetCam.x,'x'),smooth(4.1,dt));
    camera.y=lerp(camera.y,editorCameraLimit(targetCam.y,'y'),smooth(4.1,dt));
    camera.targetZoom=layout.zoom;
  }else if(window.__CE_FREE_WORLD){
    // Editor playtests use an exactly centered player, independent of map shape.
    // Newton's special camera choreography still takes precedence above.
    camera.targetZoom=1;
    camera.zoom=1;
    camera.x=centerX-V.w*.5;
    camera.y=centerY-V.h*.5;
  }else{
    const desiredX=editorCameraLimit(centerX-V.w*.42,'x');
    camera.x=lerp(camera.x,desiredX,smooth(6.5,dt));

    const screenY=player.y+player.h*.5-camera.y;
    let desiredY=camera.y;
    if(screenY<380) desiredY=player.y+player.h*.5-380;
    if(screenY>610) desiredY=player.y+player.h*.5-610;
    desiredY=editorCameraLimit(desiredY,'y');
    camera.y=lerp(camera.y,desiredY,smooth(5.5,dt));

    if(window.__CE_FREE_WORLD) camera.targetZoom=1;
    else if(selectedLevel==='EASY') camera.targetZoom=(player.x>2950&&player.x<4650)?0.96:1;
    else camera.targetZoom=(player.x>3300&&player.x<4300)?0.95:1;
  }
  camera.zoom=lerp(camera.zoom,camera.targetZoom,smooth(2.8,dt));
}

function updateNewtonRevealCamera(dt){
  const cfg=levelMeasureConfig();
  const layout=newtonViewLayout(cfg);
  const targetCam=cameraForWorldPoint(cfg.cx,cfg.cy,layout.centerSX,layout.centerSY,layout.zoom);
  camera.x=lerp(camera.x,editorCameraLimit(targetCam.x,'x'),smooth(2.2,dt));
  camera.y=lerp(camera.y,editorCameraLimit(targetCam.y,'y'),smooth(2.2,dt));
  camera.targetZoom=layout.zoom;
  camera.zoom=lerp(camera.zoom,camera.targetZoom,smooth(2.0,dt));
}

function updateLensCamera(dt){
  // During the handoff the camera is allowed to look slightly beyond the normal world clamp
  // so the lens can settle at the visual center before the screen-space measurement view takes over.
  const t=clamp(lensTransitionTimer/2.0,0,1);
  camera.x=lerp(camera.x,window.__CE_FREE_WORLD?levelMeasureConfig().cx-1800:4400,smooth(2.6+2*t,dt));
  camera.y=lerp(camera.y,0,smooth(2.4,dt));
  camera.zoom=lerp(camera.zoom,.98,smooth(2.2,dt));
}

  for(let q=.28;q<=1;q+=.18){ctx.globalAlpha=.18;ctx.strokeStyle='#e8eef1';ctx.lineWidth=1.1;ctx.beginPath();ctx.arc(cx,cy,r*q,0,Math.PI*2);ctx.stroke();}
  ctx.shadowBlur=0;

  // Decorative sample pedestal around world x=5050.
  const px=worldToScreenX(5050), py=worldToScreenY(700);
  ctx.globalAlpha=.72;ctx.fillStyle='#25303a';ctx.fillRect(px-34*camera.zoom,py-38*camera.zoom,68*camera.zoom,38*camera.zoom);
  ctx.strokeStyle='#aebbc4';ctx.lineWidth=1;ctx.strokeRect(px-34*camera.zoom,py-38*camera.zoom,68*camera.zoom,38*camera.zoom);
  ctx.globalAlpha=.62;ctx.fillStyle='#d9e1e5';ctx.fillRect(px-16*camera.zoom,py-44*camera.zoom,32*camera.zoom,5*camera.zoom);
  ctx.restore();
}

function drawNewtonApparatus(){
  if(!(selectedLevel==='EASY'||selectedLevel==='HARD')) return;
  const cfg=levelMeasureConfig();
  const cx=worldToScreenX(cfg.cx), cy=worldToScreenY(cfg.cy);
  const maxN=cfg.outerN;
  const outerWorld=darkRingRadiusWorld(maxN+.65,cfg);
  const outer=outerWorld*camera.zoom;
  if(cx+outer<0||cx-outer>V.w||cy+outer<0||cy-outer>V.h) return;

  ctx.save();

  // Circular glass / microscope field. The rings are rendered as a CONTINUOUS
  // interference intensity field instead of a stack of outline circles.
  ctx.globalAlpha=.98;
  const fringe=ctx.createRadialGradient(cx,cy,0,cx,cy,outer);
  const samples=300;
  for(let j=0;j<=samples;j++){
    const t=j/samples;
    const r=t*outerWorld;
    const order=(r/cfg.ringScale)*(r/cfg.ringScale)*(MEASURE.referenceLambda/SOURCE_LAMBDA);
    // Reflected Newton rings: dark at integer order, bright halfway between.
    let I=(1-Math.cos(TAU*order))/2;
    // Slightly compress highlights so it looks optical rather than like white contour lines.
    I=Math.pow(I,.72);
    const edgeFade=Math.pow(Math.max(0,1-Math.pow(t,5)),.22);
    const v=Math.round(7 + I*224*edgeFade);
    fringe.addColorStop(t,`rgb(${v},${v},${Math.min(255,v+3)})`);
  }
  ctx.fillStyle=fringe;
  ctx.beginPath();ctx.arc(cx,cy,outer,0,TAU);ctx.fill();

  // Glass vignette + faint lens reflection, preserving the monochrome language.
  const glass=ctx.createRadialGradient(cx-outer*.24,cy-outer*.28,outer*.03,cx,cy,outer);
  glass.addColorStop(0,'rgba(255,255,255,.11)');
  glass.addColorStop(.38,'rgba(205,222,232,.025)');
  glass.addColorStop(.82,'rgba(7,12,18,.03)');
  glass.addColorStop(1,'rgba(0,0,0,.36)');
  ctx.fillStyle=glass;ctx.beginPath();ctx.arc(cx,cy,outer,0,TAU);ctx.fill();

  // Thin physical rim only; no numbered rings, no target highlighting.
  ctx.strokeStyle='rgba(205,219,227,.28)';ctx.lineWidth=Math.max(1,1.5*camera.zoom);
  ctx.beginPath();ctx.arc(cx,cy,outer,0,TAU);ctx.stroke();
  ctx.strokeStyle='rgba(240,247,250,.10)';ctx.lineWidth=Math.max(1,4*camera.zoom);
  ctx.beginPath();ctx.arc(cx,cy,outer-5*camera.zoom,0,TAU);ctx.stroke();

  // The central reflected fringe is dark in a Newton-ring pattern. O is the only
  // pre-existing measurement reference and stays deliberately tiny.
  ctx.fillStyle='rgba(0,0,0,.72)';ctx.beginPath();ctx.arc(cx,cy,Math.max(5,7*camera.zoom),0,TAU);ctx.fill();
  ctx.fillStyle='rgba(240,246,248,.86)';ctx.beginPath();ctx.arc(cx,cy,2.4,0,TAU);ctx.fill();
  ctx.font='700 10px ui-sans-serif,system-ui';ctx.textAlign='center';ctx.fillStyle='rgba(235,242,245,.68)';ctx.fillText('O',cx,cy-14);

  // Sparse mount behind the disc to make it read as a real optical apparatus.
  ctx.globalAlpha=.20;ctx.strokeStyle='#aebdC7';ctx.lineWidth=2;
  const mount=outer+20*camera.zoom;ctx.beginPath();ctx.arc(cx,cy,mount,0,TAU);ctx.stroke();
  ctx.restore();
}

function drawEasyNewtonTarget(target,label,active,locked){

  if(!locked)ctx.setLineDash([5,5]);
  ctx.beginPath();ctx.arc(x,y,(active?12:9)+pulse*2,0,TAU);ctx.stroke();ctx.setLineDash([]);
  ctx.beginPath();ctx.moveTo(x-16,y);ctx.lineTo(x+16,y);ctx.moveTo(x,y-16);ctx.lineTo(x,y+16);ctx.stroke();
  ctx.fillStyle='rgba(242,247,249,.94)';ctx.font='850 12px ui-sans-serif,system-ui';ctx.textAlign='center';ctx.fillText(label,x,y-22);
  ctx.restore();
}

function drawHardNewtonBiteHazard(){
  if(selectedLevel!=='HARD' || TEST_MOVE.enabled) return;
  if(gameState!=='PLAY' && gameState!=='DYING') return;
  const s=hardNewtonBiteState();
  const cx=worldToScreenX(s.cfg.cx), cy=worldToScreenY(s.cfg.cy);
  const z=camera.zoom;
  const angle=s.angle;
  const ux=Math.cos(angle), uy=Math.sin(angle);
  const tx=-uy, ty=ux;
  const outer=s.outer*z;
  const inner=s.currentInner*z;
  const half=HARD_NEWTON_BITE.halfAngle;

  ctx.save();

  // Warning: a pulsing arc shows exactly which slice is about to be bitten.
  if(s.stage==='WARNING'){
    const p=.5+.5*Math.sin(elapsed*13);
    ctx.globalAlpha=.28+.34*p;
    ctx.strokeStyle='rgba(245,247,248,.92)';ctx.lineWidth=2;
    ctx.setLineDash([8,8]);
    ctx.beginPath();ctx.arc(cx,cy,(s.outer-22)*z,angle-half,angle+half);ctx.stroke();
    ctx.setLineDash([]);
    const warnR=(s.outer+10)*z;
    const wx=cx+ux*warnR, wy=cy+uy*warnR;
    ctx.translate(wx,wy);ctx.rotate(angle);
    ctx.globalAlpha=.34+.28*p;ctx.fillStyle='rgba(8,12,18,.90)';
    ctx.beginPath();ctx.moveTo(18*z,-34*z);ctx.lineTo(-18*z,0);ctx.lineTo(18*z,34*z);ctx.closePath();ctx.fill();
    ctx.fillStyle='rgba(238,243,246,.88)';ctx.beginPath();ctx.arc(5*z,-9*z,2.8*z,0,TAU);ctx.fill();
    ctx.restore();
    return;
  }

  if(s.depth<=.01){ctx.restore();return;}

  // The maw comes from outside the rings and closes over a wedge like taking a bite from a cake.
  const jawBase=(s.outer+78)*z;
  const jawTip=inner;
  const mouthHalf=Math.max(24*z,Math.tan(half)*jawTip);
  const baseHalf=Math.max(48*z,Math.tan(half)*jawBase*1.02);
  const tipX=cx+ux*jawTip, tipY=cy+uy*jawTip;
  const baseX=cx+ux*jawBase, baseY=cy+uy*jawBase;

  ctx.shadowBlur=18*z;ctx.shadowColor='rgba(0,0,0,.70)';
  const jawAlpha=.78+.18*s.depth;
  ctx.fillStyle=`rgba(5,9,14,${jawAlpha})`;
  ctx.strokeStyle='rgba(218,229,235,.42)';ctx.lineWidth=1.5;

  // Upper jaw.
  ctx.beginPath();
  ctx.moveTo(baseX+tx*baseHalf,baseY+ty*baseHalf);
  ctx.lineTo(baseX-tx*4*z,baseY-ty*4*z);
  ctx.lineTo(tipX-tx*7*z,tipY-ty*7*z);
  ctx.lineTo(tipX+tx*mouthHalf,tipY+ty*mouthHalf);
  ctx.closePath();ctx.fill();ctx.stroke();
  // Lower jaw.
  ctx.beginPath();
  ctx.moveTo(baseX-tx*baseHalf,baseY-ty*baseHalf);
  ctx.lineTo(baseX+tx*4*z,baseY+ty*4*z);
  ctx.lineTo(tipX+tx*7*z,tipY+ty*7*z);
  ctx.lineTo(tipX-tx*mouthHalf,tipY-ty*mouthHalf);
  ctx.closePath();ctx.fill();ctx.stroke();

  // Small teeth make the silhouette read as a mouth without turning it into a cartoon character.
  ctx.shadowBlur=0;ctx.fillStyle='rgba(226,235,240,.82)';
  for(let i=-2;i<=2;i++){
    const f=(i+2)/4;
    const rr=lerp(jawTip+18*z,jawBase-30*z,f);
    const midX=cx+ux*rr, midY=cy+uy*rr;
    const spread=lerp(mouthHalf*.68,baseHalf*.46,f);
    const tooth=7*z;
    for(const sign of [-1,1]){
      const qx=midX+tx*spread*sign, qy=midY+ty*spread*sign;
      ctx.beginPath();
      ctx.moveTo(qx,qy);ctx.lineTo(qx-ux*tooth+tx*4*z*sign,qy-uy*tooth+ty*4*z*sign);
      ctx.lineTo(qx-ux*tooth-tx*4*z*sign,qy-uy*tooth-ty*4*z*sign);ctx.closePath();ctx.fill();
    }
  }

  if(s.stage==='BITE'){
    const flash=.45+.45*Math.sin(elapsed*24);
    ctx.globalAlpha=.22*flash;ctx.fillStyle='#eef4f7';
    ctx.beginPath();ctx.arc(cx,cy,(s.inner+18)*z,angle-half*.82,angle+half*.82);ctx.lineTo(cx,cy);ctx.closePath();ctx.fill();
  }
  ctx.restore();
}

function drawNewtonMeasurementLayer(){
  if(!(selectedLevel==='EASY'||selectedLevel==='HARD')) return;
  const cfg=levelMeasureConfig();
  ctx.save();

  const hasOrbit=newtonRails.some(c=>c.newtonOrbitRail);
  if(hasOrbit){
    const K=newtonMarker('K');
    const I=newtonMarker('I');
    const Kp=newtonMarker("K'");
    const geo=selectedLevel==='HARD'?hardNewtonGeometry():easyNewtonGeometry();

    if(geo){
      // K fixes one diameter through O. I and K' are fixed geometric intersections;
      // only the platforms continue to move.
      const outer=darkRingRadiusWorld(cfg.outerN+.65,cfg)+10;
      const ax1={x:cfg.cx+geo.ux*outer,y:cfg.cy+geo.uy*outer};
      const ax2={x:cfg.cx-geo.ux*outer,y:cfg.cy-geo.uy*outer};
      const p1={x:worldToScreenX(ax1.x),y:worldToScreenY(ax1.y)};
      const p2={x:worldToScreenX(ax2.x),y:worldToScreenY(ax2.y)};
      const lockedAt=selectedLevel==='HARD'?hardNewtonAxisLockedAt:easyNewtonAxisLockedAt;
      const lockAge=Math.max(0,elapsed-lockedAt);
      const sweep=clamp(lockAge/(selectedLevel==='HARD'?.34:.42),0,1);
      const sx=lerp(worldToScreenX(cfg.cx),p2.x,sweep), sy=lerp(worldToScreenY(cfg.cy),p2.y,sweep);
      ctx.strokeStyle=selectedLevel==='HARD'?'rgba(244,248,250,.70)':'rgba(239,245,248,.55)';
      ctx.lineWidth=selectedLevel==='HARD'?1.7:1.35;ctx.setLineDash([8,7]);
      ctx.beginPath();ctx.moveTo(p1.x,p1.y);ctx.lineTo(sx,sy);ctx.stroke();ctx.setLineDash([]);

      drawEasyNewtonTarget(geo.I,'I',newtonMeasurementStep===1,!!I);
      drawEasyNewtonTarget(geo.Kp,"K′",newtonMeasurementStep===2,!!Kp);
    }

    for(const m of newtonMarkers){
      if(!Number.isFinite(m.x)||!Number.isFinite(m.y)) continue;
      const x=worldToScreenX(m.x),y=worldToScreenY(m.y);
      ctx.shadowBlur=selectedLevel==='HARD'?20:15;ctx.shadowColor='rgba(244,248,250,.52)';ctx.fillStyle='#f5f8fa';
      ctx.beginPath();ctx.arc(x,y,5,0,TAU);ctx.fill();ctx.shadowBlur=0;
      ctx.strokeStyle='rgba(242,247,249,.88)';ctx.lineWidth=1.4;
      ctx.beginPath();ctx.arc(x,y,10,0,TAU);ctx.stroke();
      ctx.fillStyle='#f4f7f9';ctx.font='900 12px ui-sans-serif,system-ui';ctx.textAlign='center';ctx.fillText(m.label.replace("'","′"),x,y-18);
    }

    ctx.restore();
    return;
  }

  ctx.restore();
}

function newtonObjective(){
  const cfg=levelMeasureConfig();
  if(selectedLevel==='EASY'){
    if(newtonMeasurementStep===0) return [`CHỌN K TRÊN VÂN k = ${cfg.k}`,'Đứng trên thanh k · X để khóa K'];
    if(newtonMeasurementStep===1) return [`TÌM I TRÊN VÂN i = ${cfg.i}`,'Nhảy sang thanh i · canh đúng trục K–O · X'];
    if(newtonMeasurementStep===2) return [`TÌM K′ TRÊN VÂN k = ${cfg.k}`,'Trở lại thanh k · canh phía đối diện K · X'];
    return ['ĐÃ ĐỦ K · I · K′','Đang tính B, b và bước sóng λ'];
  }
  const bite=hardNewtonBiteState();
  const hazard=bite.stage==='WARNING'?' · CẢNH BÁO: MÕM NHIỄU SẮP ĐỚP':'';
  if(newtonMeasurementStep===0) return [`CHỌN K TRÊN VÂN k = ${cfg.k}`,`Thanh k màu TRẮNG cố định · chọn hướng đo rồi X${hazard}`];
  if(newtonMeasurementStep===1) return [`ĐẾN I TRÊN VÂN i = ${cfg.i}`,`Thanh i chạy ngược chiều · canh trục K–O · X${hazard}`];
  if(newtonMeasurementStep===2) return [`ĐẾN K′ TRÊN VÂN k = ${cfg.k}`,`Quay lại thanh k · canh phía đối diện K · X${hazard}`];
  return ['ĐÃ ĐỦ K · I · K′','Đang dựng B, b và tính bước sóng λ'];
}

function drawNewtonRevealResult(){
  if(!(selectedLevel==='EASY'||selectedLevel==='HARD') || (gameState!=='NEWTON_REVEAL' && gameState!=='COMPLETE') || newtonMarkers.length<3) return;
  const cfg=levelMeasureConfig();
  const tm=gameState==='COMPLETE'?cfg.revealDuration:newtonRevealTimer;
  const K=newtonMarker('K'),I=newtonMarker('I'),Kp=newtonMarker("K'");
  if(!K||!I||!Kp)return;
  const result=newtonMeasurementResult();
  ctx.save();

  if([K,I,Kp].every(m=>Number.isFinite(m.x)&&Number.isFinite(m.y))){
    const ps={
      K:{x:worldToScreenX(K.x),y:worldToScreenY(K.y)},
      I:{x:worldToScreenX(I.x),y:worldToScreenY(I.y)},
      Kp:{x:worldToScreenX(Kp.x),y:worldToScreenY(Kp.y)},
    };
    const geo=selectedLevel==='HARD'?hardNewtonGeometry():easyNewtonGeometry();
    const nx=geo?-geo.uy:0, ny=geo?geo.ux:1;

    function animatedSegment(a,b,start,dur,label,dashed=false,offset=18){
      if(tm<=start)return;
      const p=clamp((tm-start)/dur,0,1);
      const ex=lerp(a.x,b.x,p),ey=lerp(a.y,b.y,p);
      ctx.strokeStyle='rgba(243,247,249,.94)';ctx.lineWidth=dashed?2:2.8;
      if(dashed)ctx.setLineDash([8,6]);
      ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(ex,ey);ctx.stroke();ctx.setLineDash([]);
      if(p>.80){
        ctx.textAlign='center';ctx.fillStyle='#f2f6f8';ctx.font='900 14px ui-sans-serif,system-ui';
        ctx.fillText(label,(a.x+b.x)/2+nx*offset,(a.y+b.y)/2+ny*offset);
      }
    }
    animatedSegment(ps.K,ps.I,.35,.82,'B = KI',false,20);
    animatedSegment(ps.I,ps.Kp,1.15,.72,"b = IK′",true,-22);

    if(tm>2.0){
      const a=clamp((tm-2.0)/.55,0,1);ctx.globalAlpha=a;
      ctx.fillStyle='rgba(4,8,14,.84)';rr(455,665,690,126,16);ctx.fill();ctx.strokeStyle='rgba(215,229,237,.20)';ctx.stroke();
      ctx.textAlign='center';ctx.fillStyle='#edf4f7';ctx.font='800 16px ui-sans-serif,system-ui';ctx.fillText('B = KI = rₖ + rᵢ        b = IK′ = rₖ − rᵢ',800,698);
      if(result){
        ctx.fillStyle='rgba(220,231,237,.72)';ctx.font='650 12px ui-monospace,monospace';ctx.fillText(`B = ${result.Bmm.toFixed(3)} mm     b = ${result.bmm.toFixed(3)} mm     R = ${cfg.Rmm} mm`,800,726);
        ctx.fillStyle='#f4f8fa';ctx.font='900 18px ui-sans-serif,system-ui';ctx.fillText('λ = Bb / [(k − i)R]',800,752);
        ctx.font='950 24px ui-sans-serif,system-ui';ctx.fillText(`λ ≈ ${result.lambdaNm.toFixed(1)} nm`,800,781);
      }
    }
    if(selectedLevel==='HARD' && tm>2.55){
      const c={x:worldToScreenX(cfg.cx),y:worldToScreenY(cfg.cy)};
      const base=darkRingRadiusWorld(cfg.k,cfg)*camera.zoom;
      for(let q=0;q<3;q++){
        const p=clamp((tm-2.55-q*.16)/1.05,0,1);
        if(p<=0) continue;
        ctx.globalAlpha=(1-p)*.38;ctx.strokeStyle='#f0f5f7';ctx.lineWidth=1.5;
        ctx.beginPath();ctx.arc(c.x,c.y,base*(.38+.72*p),0,TAU);ctx.stroke();
      }
    }
    ctx.restore();
    return;
  }

  // Legacy horizontal reveal fallback.
  const y1=worldToScreenY(cfg.cy+92), y2=worldToScreenY(cfg.cy+138);
  const kx=worldToScreenX(K.measuredX), ix=worldToScreenX(I.measuredX), kpx=worldToScreenX(Kp.measuredX);
  if(tm>.45){
    const p=clamp((tm-.45)/.75,0,1),x2=lerp(kx,ix,p);ctx.strokeStyle='rgba(242,247,249,.90)';ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(kx,y1);ctx.lineTo(x2,y1);ctx.stroke();
    if(p>.78){ctx.textAlign='center';ctx.fillStyle='#eef5f8';ctx.font='800 13px ui-sans-serif,system-ui';ctx.fillText('B = KI',(kx+ix)/2,y1-9);}
  }
  if(tm>1.15){
    const p=clamp((tm-1.15)/.75,0,1),x2=lerp(ix,kpx,p);ctx.strokeStyle='rgba(194,208,216,.88)';ctx.lineWidth=2;ctx.setLineDash([7,5]);ctx.beginPath();ctx.moveTo(ix,y2);ctx.lineTo(x2,y2);ctx.stroke();ctx.setLineDash([]);
    if(p>.78){ctx.textAlign='center';ctx.fillStyle='rgba(232,239,243,.90)';ctx.font='800 13px ui-sans-serif,system-ui';ctx.fillText("b = IK'",(ix+kpx)/2,y2-9);}
  }
  if(tm>2.0){
    const a=clamp((tm-2.0)/.5,0,1);ctx.globalAlpha=a;ctx.fillStyle='rgba(4,8,14,.78)';rr(520,660,560,126,16);ctx.fill();ctx.strokeStyle='rgba(215,229,237,.18)';ctx.stroke();
    ctx.textAlign='center';ctx.fillStyle='#edf4f7';ctx.font='750 16px ui-sans-serif,system-ui';ctx.fillText('B = rₖ + rᵢ        b = rₖ − rᵢ',800,695);
    if(result){ctx.fillStyle='rgba(220,231,237,.68)';ctx.font='600 12px ui-monospace,monospace';ctx.fillText(`B ${result.Bmm.toFixed(3)} mm     b ${result.bmm.toFixed(3)} mm`,800,724);ctx.fillStyle='#f3f7f9';ctx.font='850 22px ui-sans-serif,system-ui';ctx.fillText(`λ ≈ ${result.lambdaNm.toFixed(1)} nm`,800,758);}
  }
  ctx.restore();
}

  const visual = state==='BRIGHT'

      ? { body:'#050505', outline:'#74818b', glow:0, outlineWidth:1 }

  ctx.save();
  ctx.translate(worldToScreenX(player.x),worldToScreenY(player.y));
  ctx.scale(camera.zoom,camera.zoom);
  ctx.globalAlpha=1;
  ctx.fillStyle=visual.body;
  ctx.strokeStyle=visual.outline;
  ctx.lineWidth=visual.outlineWidth;
  if(visual.glow){ctx.shadowColor='rgba(255,255,255,.50)';ctx.shadowBlur=visual.glow;}

  ctx.beginPath(); ctx.arc(cx,y+12,9,0,Math.PI*2);ctx.fill();ctx.stroke();
  rr(cx-9,y+22,18,25,8);ctx.fill();ctx.stroke();
  ctx.shadowBlur=0;
  // Draw an understated 1px silhouette edge around the limbs on Dark only.
  // Repaint with the exact body color, rather than the light outline that made Dark appear white.
  ctx.lineCap='round';
  const limbPath=()=>{
    ctx.beginPath(); ctx.moveTo(cx-5,y+29);ctx.lineTo(cx-14,y+43);
    ctx.moveTo(cx+5,y+29);ctx.lineTo(cx+14,y+43);
    ctx.moveTo(cx-5,y+45);ctx.lineTo(cx-10,y+61);
    ctx.moveTo(cx+5,y+45);ctx.lineTo(cx+10,y+61);
  };
  if(state==='DARK'){ctx.strokeStyle=visual.outline;ctx.lineWidth=8;limbPath();ctx.stroke();}
  ctx.strokeStyle=visual.body;ctx.lineWidth=6.3;limbPath();ctx.stroke();
  ctx.restore();
}

function drawTuner(){
  // Wave-first cyclic phase tuner. In the Newton framing it slides left so it never covers the rings.
  const W=500,H=142,x=tunerPanelX,y=V.h-H-18;
  ctx.save();
  ctx.fillStyle='rgba(5,9,17,.88)'; rr(x,y,W,H,17);ctx.fill();
  ctx.strokeStyle='rgba(205,220,230,.18)';ctx.lineWidth=1;ctx.stroke();

  ctx.fillStyle='rgba(225,234,239,.56)';ctx.font='700 9px ui-sans-serif,system-ui';ctx.textAlign='left';
  ctx.fillText('GIAO THOA · VÒNG PHA',x+20,y+19);

  const wx=x+64, ww=292;
  const yA=y+48, yB=y+84;
  const spatial=.082;
  const phase=wrapPhase(player.phase);

  // Faint alignment guides help the eye compare crests/troughs directly.
  ctx.strokeStyle='rgba(190,205,215,.07)';ctx.lineWidth=1;
  for(let gx=wx;gx<=wx+ww;gx+=49){ctx.beginPath();ctx.moveTo(gx,y+30);ctx.lineTo(gx,y+101);ctx.stroke();}

  function waveRow(baseY, offset, stroke, width=2){
    ctx.strokeStyle=stroke;ctx.lineWidth=width;ctx.beginPath();
    for(let i=0;i<=ww;i+=2){const xx=wx+i, yy=baseY+Math.sin(i*spatial+offset)*12;if(i===0)ctx.moveTo(xx,yy);else ctx.lineTo(xx,yy);}ctx.stroke();
  }

  ctx.fillStyle='rgba(225,234,239,.52)';ctx.font='700 9px ui-sans-serif,system-ui';ctx.textAlign='right';
  ctx.fillText('A',wx-18,yA+3);ctx.fillText('B',wx-18,yB+3);
  ctx.font='600 8px ui-sans-serif,system-ui';ctx.fillStyle='rgba(225,234,239,.30)';ctx.fillText('CỐ ĐỊNH',wx-18,yA+15);ctx.fillText('DỊCH PHA',wx-18,yB+15);

  waveRow(yA,0,'rgba(246,249,250,.94)',2.1);
  waveRow(yB,phase,'rgba(157,171,181,.98)',2.1);

  // Compact status only; the waveform alignment remains the primary readout.
  const sv=stateVisual();
  const sx=x+378, sy=y+34, sw=100, sh=62;
  ctx.shadowBlur=player.state==='BRIGHT'?14:player.state==='DARK'?3:7;ctx.shadowColor='rgba(255,255,255,.30)';
  ctx.fillStyle=sv.fill;rr(sx,sy,sw,sh,14);ctx.fill();ctx.shadowBlur=0;
  ctx.strokeStyle=sv.edge;ctx.globalAlpha=.66;ctx.stroke();ctx.globalAlpha=1;
  ctx.fillStyle=sv.text;ctx.textAlign='center';ctx.font='800 14px ui-sans-serif,system-ui';ctx.fillText(sv.label,sx+sw/2,sy+27);
  ctx.font='700 7.5px ui-sans-serif,system-ui';ctx.globalAlpha=.68;ctx.fillText(sv.relation,sx+sw/2,sy+45);ctx.globalAlpha=1;

  // Tiny cyclic strip with a continuous ombre that still makes the next dark/bright zone readable.
  // It is derived from the SAME phase->intensity->state logic as gameplay,
  // so the tone under the marker always matches the actual player state.
  const bx=x+112, by=y+114, bw=210,bh=12;
  const marker=bx+bw/2;
  const pxPerCycle=112;
  function stripColorForPhase(localPhase){
    const I=intensityForPhase(localPhase);
    const s=stateFor(I);
    // Ombre brightness from interference intensity.
    let v=Math.round(18 + I*226);
    let r=v, g=v, b=v;
    // Make the tuning band read more clearly by tinting it slightly blue-gray and lifting it a bit.
    if(s==='TUNING'){
      r=Math.round(v*0.92 + 8);
      g=Math.round(v*0.95 + 10);
      b=Math.round(v*1.02 + 18);
    }
    // Give the extreme bands a cleaner feel.
    if(s==='BRIGHT'){ r=Math.min(245,r+6); g=Math.min(247,g+6); b=Math.min(248,b+6); }
    if(s==='DARK'){ r=Math.max(10,r-6); g=Math.max(12,g-6); b=Math.max(14,b-6); }
    return `rgb(${r},${g},${b})`;
  }
  for(let ix=0; ix<bw; ix++){
    const localPhase = wrapPhase(player.phase + ((ix + 0.5 - bw/2) / pxPerCycle) * TAU);
    ctx.fillStyle = stripColorForPhase(localPhase);
    ctx.fillRect(bx+ix, by, 1, bh);
  }
  // Keep soft state boundaries so it is easy to read what zone is about to turn dark or bright.
  let prevState = null;
  for(let ix=0; ix<=bw; ix++){
    const probePhase = wrapPhase(player.phase + ((ix - bw/2) / pxPerCycle) * TAU);
    const s = stateFor(intensityForPhase(probePhase));
    if(ix>0 && s!==prevState){
      const lx=bx+ix;
      ctx.strokeStyle='rgba(245,248,250,.22)'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(lx+.5,by-1); ctx.lineTo(lx+.5,by+bh+1); ctx.stroke();
    }
    prevState = s;
  }
  // A faint top sheen helps the ombre read as a strip instead of separate blocks.
  const sheen=ctx.createLinearGradient(bx,by,bx,by+bh);
  sheen.addColorStop(0,'rgba(255,255,255,.10)');
  sheen.addColorStop(.55,'rgba(255,255,255,.02)');
  sheen.addColorStop(1,'rgba(0,0,0,.12)');
  ctx.fillStyle=sheen; ctx.fillRect(bx,by,bw,bh);

  ctx.strokeStyle='rgba(235,241,244,.18)';ctx.lineWidth=1;ctx.strokeRect(bx,by,bw,bh);
  ctx.strokeStyle='#f7fafb';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(marker,by-4);ctx.lineTo(marker,by+bh+4);ctx.stroke();
  ctx.fillStyle='rgba(225,234,239,.42)';ctx.font='600 8px ui-sans-serif,system-ui';ctx.textAlign='center';ctx.fillText('SÁNG  ·  ĐIỀU PHA  ·  TỐI  ·  ĐIỀU PHA  ·  LẶP',bx+bw/2,by+24);

  ctx.textAlign='left';ctx.fillStyle='rgba(225,234,239,.40)';ctx.font='650 9px ui-sans-serif,system-ui';ctx.fillText('← / →  DỊCH SÓNG B  ·  PHA TUẦN HOÀN',x+338,y+122);
  ctx.restore();
}

function drawLensTransitionOverlay(){
  if(gameState!=='LENS_TRANSITION') return;
  const t=lensTransitionTimer;
  const lensX=worldToScreenX(5200), lensY=worldToScreenY(410);
  ctx.save();
  // Early lock acknowledgement.
  const lockA=clamp(1-Math.max(0,t-.55)/.35,0,1);
  if(t<.9){ctx.globalAlpha=.9*lockA;ctx.textAlign='center';ctx.fillStyle='#edf4f7';ctx.font='700 15px ui-sans-serif,system-ui';ctx.fillText('ĐÃ KHÓA MẪU ÁNH SÁNG',800,165);ctx.font='500 11px ui-monospace,monospace';ctx.globalAlpha=.58*lockA;ctx.fillText(`φ ${(samplePhase*180/Math.PI).toFixed(0)}°  ·  I ${sampleIntensity.toFixed(2)}  ·  λ ${SOURCE_LAMBDA} nm`,800,187);}

  // Two coherent waveform traces leave the tuner and converge on the lens.
  if(t>.35&&t<1.35){
    const a=clamp((t-.35)/.22,0,1)*clamp((1.35-t)/.3,0,1);
    ctx.globalAlpha=.52*a;ctx.lineWidth=1.7;
    const startX=800,startY=785;
    const phase=samplePhase;
    for(let wv=0;wv<2;wv++){
      ctx.strokeStyle=wv===0?'#f1f5f6':'#9da8af';ctx.setLineDash(wv?[7,5]:[]);ctx.beginPath();
      for(let j=0;j<=70;j++){
        const u=j/70, bx=lerp(startX,lensX,u), by=lerp(startY,lensY,u);
        const nx=-(lensY-startY), ny=(lensX-startX), len=Math.hypot(nx,ny)||1;
        const amp=8*(1-u), off=Math.sin(u*34+(wv?phase:0))*amp;
        const xx=bx+nx/len*off, yy=by+ny/len*off;
        if(j===0)ctx.moveTo(xx,yy);else ctx.lineTo(xx,yy);
      }ctx.stroke();
    }ctx.setLineDash([]);
    ctx.globalAlpha=.24*a;ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(lensX,lensY-185);ctx.lineTo(lensX,lensY+185);ctx.stroke();
  }

  // Fade platform world while the front-facing ring view grows in.
  const dark=clamp((t-1.0)/.78,0,.82);
  ctx.globalAlpha=dark;ctx.fillStyle='#03060b';ctx.fillRect(0,0,V.w,V.h);
  ctx.restore();
  if(t>1.55){
    const ringA=clamp((t-1.55)/.72,0,1);
    drawMeasurementBackdrop(ringA, true);
  }
}

function drawMeasurementBackdrop(alpha=1, transitionOnly=false){
  const cx=MEASURE.cx,cy=MEASURE.cy;
  ctx.save();ctx.globalAlpha=alpha;
  const bg=ctx.createRadialGradient(cx,cy,40,cx,cy,650);bg.addColorStop(0,'#111923');bg.addColorStop(.52,'#080d15');bg.addColorStop(1,'#03060b');ctx.fillStyle=bg;ctx.fillRect(0,0,V.w,V.h);

  // Glass disc.
  const discR=390;
  const glass=ctx.createRadialGradient(cx-75,cy-90,25,cx,cy,discR);glass.addColorStop(0,'rgba(235,242,245,.11)');glass.addColorStop(.52,'rgba(145,158,167,.07)');glass.addColorStop(1,'rgba(200,215,225,.025)');
  ctx.fillStyle=glass;ctx.beginPath();ctx.arc(cx,cy,discR,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='rgba(205,218,226,.18)';ctx.lineWidth=1.4;ctx.beginPath();ctx.arc(cx,cy,discR,0,Math.PI*2);ctx.stroke();

  // Alternating bright and dark Newton fringes. Dark targets are the measurement references.
  ctx.shadowBlur=14;ctx.shadowColor='rgba(235,243,247,.16)';
  for(let n=0;n<6;n++){
    const rb=brightRingRadius(n);
    ctx.strokeStyle='rgba(230,237,241,.48)';ctx.lineWidth=4.5;ctx.beginPath();ctx.arc(cx,cy,rb,0,Math.PI*2);ctx.stroke();
  }
  ctx.shadowBlur=0;
  for(let n=1;n<=6;n++){
    const rd=darkRingRadius(n);
    ctx.strokeStyle='rgba(0,0,0,.88)';ctx.lineWidth=8;ctx.beginPath();ctx.arc(cx,cy,rd,0,Math.PI*2);ctx.stroke();
    ctx.strokeStyle='rgba(185,198,207,.17)';ctx.lineWidth=1;ctx.beginPath();ctx.arc(cx,cy,rd,0,Math.PI*2);ctx.stroke();
  }
  ctx.fillStyle='rgba(1,3,6,.88)';ctx.beginPath();ctx.arc(cx,cy,28,0,Math.PI*2);ctx.fill();

  if(!transitionOnly){
    const introPulse=measurementIntroTimer<1.25 ? 1-measurementIntroTimer/1.25 : 0;
    const hintPulse=fringeHintTimer>0 ? .5+.5*Math.sin(elapsed*14) : 0;
    const p=Math.max(introPulse*.7,hintPulse*.8);
    if(p>0){
      ctx.shadowBlur=20;ctx.shadowColor='rgba(245,248,250,.55)';ctx.strokeStyle=`rgba(245,248,250,${.28+.55*p})`;ctx.lineWidth=2.8;
      for(const n of [MEASURE.i,MEASURE.k]){ctx.beginPath();ctx.arc(cx,cy,darkRingRadius(n),0,Math.PI*2);ctx.stroke();}
      ctx.shadowBlur=0;
    }
  }
  ctx.restore();
}

  const buttons=final?'<button id="quang-replay" style="padding:12px 18px;border-radius:9px;background:#3d5367;border:0;color:#fff;cursor:pointer;">↻ Chơi lại từ đầu</button>':__QP_FULL_GAME__?'<button id="quang-next" style="padding:12px 18px;border-radius:9px;background:#d9a344;border:0;color:#111;font-weight:700;cursor:pointer;">▶ Màn tiếp theo</button>':'<button id="quang-replay" style="padding:12px 18px;border-radius:9px;background:#3d5367;border:0;color:#fff;cursor:pointer;">↻ Chơi lại</button>';
  panel.innerHTML='<div style="width:min(630px,95vw);max-height:92vh;overflow:auto;background:#15202d;padding:26px;border:1px solid #806d47;border-radius:18px;box-shadow:0 0 55px #0009;">'+
    '<div style="color:#f7d187;font-size:15px;font-weight:800;letter-spacing:.12em;">✦ QUANG ĐIỂM</div>'+
    '<h1 style="font-size:30px;margin:8px 0 5px;">'+(final?'TỔNG KẾT TOÀN BỘ GAME':'HOÀN THÀNH MÀN '+quangEsc(quangLevelId()))+'</h1>'+
    '<div style="font-size:18px;margin:11px 0;color:#ffe1a4;">Đã nhặt '+stats.picked+' / '+stats.total+' Quang điểm toàn bộ</div>'+
    '<div style="font-size:13px;color:#bac7d2;">Màn hiện tại: '+quangCount+'/'+quangTotal+' · Quang điểm không bắt buộc để qua màn.</div>'+quangProjectTable()+
    '<div style="display:flex;gap:9px;flex-wrap:wrap;margin-top:15px;">'+buttons+'<button id="quang-close" style="padding:12px 18px;border-radius:9px;border:1px solid #697989;background:transparent;color:#ddd;cursor:pointer;">Đóng bảng</button></div></div>';
  panel.querySelector('#quang-next')?.addEventListener('click',()=>quangBeginLevel(quangPackIndex+1));
  panel.querySelector('#quang-replay')?.addEventListener('click',()=>quangBeginLevel(__QP_FULL_GAME__?0:quangPackIndex));
  panel.querySelector('#quang-close')?.addEventListener('click',quangHideComplete);
}
function quangBeginLevel(index){
  if(__QP_FULL_GAME__){quangPackIndex=Math.max(0,Math.min(__QP_PACK__.length-1,index));window.__CE_CONFIG__=__QP_PACK__[quangPackIndex];}
  window.__CE_TEST_START__=null;
  startLevel('EASY');
}
// The original 2-card EASY/HARD menu is not relevant to a multi-level export.
let quangResumeState='PLAY';
function quangShowPackMenu(){
  if(gameState==='QUANG_MENU'){quangHideComplete();gameState=quangResumeState;return;}
  quangResumeState=gameState;
  gameState='QUANG_MENU';keys.clear();pressed.clear();
  const stats=quangCounts(),panel=quangPanel();panel.style.display='flex';
  panel.innerHTML='<div style="max-height:90vh;overflow:auto;width:min(620px,95vw);background:#15202d;border:1px solid #6b6049;border-radius:16px;padding:24px;">'+
    '<div style="color:#f7d187;font-weight:800">✦ CONTRAST · CHỌN MÀN</div><h2>Game '+__QP_PACK__.length+' màn</h2><p style="color:#ffdea2">Đã nhặt '+stats.picked+'/'+stats.total+' Quang điểm toàn bộ</p><p style="font-size:12px;color:#b4becb">Chọn màn để chơi hoặc trở lại. Quang điểm không bắt buộc để hoàn thành.</p>'+
    '<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;max-height:47vh;overflow:auto;">'+stats.levels.map((l,i)=>'<button data-quang-level="'+i+'" style="white-space:normal;text-align:left;background:#233444;border:1px solid '+(i===quangPackIndex?'#e2b56b':'#45596b')+';border-radius:8px;padding:10px;color:#eee;cursor:pointer;">'+quangEsc(l.id)+' <span style="color:#f6d188">✦ '+l.picked+'/'+l.total+'</span></button>').join('')+'</div>'+
    '<button id="quang-resume" style="margin-top:16px;padding:11px 15px;background:#dca748;border:0;border-radius:8px;cursor:pointer;font-weight:750;">▶ Tiếp tục</button></div>';
  panel.querySelector('#quang-resume').onclick=()=>{gameState=quangResumeState;quangHideComplete();};
  for(const el of panel.querySelectorAll('[data-quang-level]'))el.onclick=()=>quangBeginLevel(Number(el.dataset.quangLevel));
}
const __quangOriginalGoToMenu=goToLevelSelect;
goToLevelSelect=function(){if(__QP_FULL_GAME__)quangShowPackMenu();else __quangOriginalGoToMenu();};
const __quangFinishComplete=finishComplete;
finishComplete=function(){__quangFinishComplete();if(__QP_FULL_GAME__)quangFinishedLevels.add(quangLevelId());quangShowComplete();};
window.addEventListener('keydown',e=>{
  if(gameState==='COMPLETE'&&(e.code==='Enter'||e.code==='Space')&&__QP_FULL_GAME__){
    e.stopImmediatePropagation();e.preventDefault();quangBeginLevel(quangPackIndex+1<__QP_PACK__.length?quangPackIndex+1:0);
  }
},true);
window.__CE_QUANG_STATE__=()=>({playtest:__QP_PLAYTEST__,level:quangLevelId(),count:quangCount,total:quangTotal,points:quangPoints.map(q=>({id:q.id,collected:q.collected,x:q.x,y:q.y})),progress:quangProgressClone(),summary:quangCounts(),packIndex:quangPackIndex,fullGame:__QP_FULL_GAME__,effectParticles:quangFx.length,resultOpen:quangPanel().style.display==='flex'});
if(window.__CE_QA_TEST__)window.__CE_QA_TEST_HOOK__={finish:()=>finishComplete(),next:()=>quangBeginLevel(quangPackIndex+1)};
quangReadProgress();
quangRebuild();

// Optional, read-only diagnostics; original gameplay update runs exactly once.
const parityDiagnostics = (() => {
  let enabled = new URLSearchParams(location.search).get('parityDiagnostics') === '1';
  let runId = 'HTML-' + Date.now(), frameIndex = 0, simulationTime = 0;
  const records = [];
  let lastX = false;
  const levelId = () => window.__CE_CONFIG__?.id || quangLevelId();
  function emit(event, data = {}) {
    if (!enabled) return;
    records.push({schemaVersion:1,runId,environment:'HTML',levelId:levelId(),frameIndex,
      simulationTime,deltaTime:0,event,...data});
  }
  function snapshot() {
    return {position:{x:player.x,y:player.y},size:{x:player.w,y:player.h},
      grounded:player.grounded,groundedOn:player.groundedOn?.name ?? player.groundedOn?.id ?? null,
      movementState:player.state,phase:player.phase,intensity:player.intensity,
      velocity:{x:player.vx,y:player.vy},gameState,checkpoint:activeCheckpoint,
      newtonStage:newtonMeasurementStep,newtonActive:newtonMeasurementStarted,
      newtonMarks:newtonMarkers.length,collectibles:quangCount};
  }
  const originalUpdate = update;
  update = function(dt) {
    if (!enabled) return originalUpdate.apply(this, arguments);
    const before=snapshot(), held=[...keys], down=[...pressed];
    const xHeld=keys.has('KeyX');
    const input={held,pressed:down,x:{held:xHeld,pressed:down.includes('KeyX'),released:lastX&&!xHeld}};
    originalUpdate.apply(this, arguments);
    frameIndex++; simulationTime+=dt; lastX=xHeld;
    const after=snapshot();
    emit('frame',{deltaTime:dt,objectId:'player',objectType:'Player',coordinateSystem:'HTML-top-left-pixels',
      ...after,before:before.position,appliedDisplacement:{x:after.position.x-before.position.x,y:after.position.y-before.position.y},input,
      observationPhase:'after-update',collision:{grounded:after.grounded,groundedOn:after.groundedOn}});
    for(const [index,p] of terrain.entries()) {
      if(!movingPlatforms.includes(p) && !newtonRails.includes(p)) continue;
      const authored=window.__CE_CONFIG__?.terrain?.[index];
      emit('frame',{deltaTime:dt,objectId:authored?.id || p.name || 'platform-'+index,objectType:'Platform',
        position:{x:p.x,y:p.y},size:{x:p.w,y:p.h},material:p.material,orbitRole:p.orbitRole ?? null,
        observationPhase:'after-update'});
    }
    for(const [field,event] of [['gameState','state_changed'],['checkpoint','checkpoint'],['collectibles','collectible'],
      ['newtonStage','newton_stage'],['newtonMarks','newton_capture'],['newtonActive','newton_activation']]) {
      if(before[field]!==after[field]) emit(event,{objectId:'player',field,before:before[field],after:after[field]});
    }
  };
  const originalConsoleEvent=consoleEvent;
  consoleEvent=function(type,data={}) {
    originalConsoleEvent.apply(this,arguments);
    emit(type,{objectId:'player',...data});
  };
  const api={
    enable(value=true){enabled=!!value;emit('diagnostics_enabled',{snapshot:snapshot()});},
    clear(id){records.length=0;frameIndex=0;simulationTime=0;runId=id||'HTML-'+Date.now();lastX=false;},
    records:()=>records.slice(),jsonl:()=>records.map(r=>JSON.stringify(r)).join('\n')+'\n',
    export(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([api.jsonl()],{type:'application/x-ndjson'}));
      a.download=runId+'.jsonl';a.click();URL.revokeObjectURL(a.href);}
  };
  emit('diagnostics_initialized',{snapshot:snapshot()});
  return api;
})();
window.__CONTRAST_PARITY_DIAGNOSTICS__=parityDiagnostics;


})();
</script>
