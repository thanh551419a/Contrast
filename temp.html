<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
    <title>CONTRAST — Giải đố giao thoa ánh sáng</title>
    <style>
        :root {
            color-scheme: dark;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #050812;
        }

        body {
            display: grid;
            place-items: center;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        }

        #wrap {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: grid;
            place-items: center;
            overflow: hidden;
        }

        canvas {
            display: block;
            width: min(100vw, calc(100vh * 16 / 9));
            height: min(100vh, calc(100vw * 9 / 16));
            background: #07101c;
            box-shadow: 0 0 80px rgba(0, 0, 0, .55);
            outline: none;
        }

        #fallback {
            display: none;
        }
    </style>
</head>

<body>
    <div id="wrap">
        <canvas id="game" width="1600" height="900"
            aria-label="CONTRAST - trò chơi giải đố giao thoa ánh sáng"></canvas>
        <div id="fallback">CONTRAST · CHỌN MÀN ĐỂ BẮT ĐẦU</div>
    </div>
    <script>
        (() => {
            'use strict';

            // ============================================================
            // CONTRAST — single-file browser prototype
            // Continuous cyclic phase tuning -> interference intensity -> collision state.
            // Visual language is intentionally monochrome: only BRIGHT/DARK are extrema; GRAY means in-between TUNING.
            // ============================================================

            const canvas = document.getElementById('game');
            const ctx = canvas.getContext('2d', { alpha: false });
            const V = { w: 1600, h: 900 };
            const WORLD = { w: 5600, h: 1200, deathY: 1080 };
            const MAT = { WHITE: 'WHITE', GRAY: 'GRAY', BLACK: 'BLACK' };
            const keys = new Set();
            const pressed = new Set();
            let debug = false;
            let elapsed = 0;
            let last = performance.now();
            let gameState = 'LEVEL_SELECT'; // LEVEL_SELECT, PLAY, DYING, LENS_TRANSITION, MEASUREMENT, MEASUREMENT_RESULT, COMPLETE
            let selectedLevel = 'EASY';
            let menuIndex = 0;
            let deathTimer = 0;
            let completeTimer = 0;
            let screenPulse = 0;
            let checkpointFlash = 0;
            let hintTimer = 0;
            let audioReady = false;
            let lastGrounded = false;
            let tuneDir = 0;

            // Test/free-move mode. Press T during PLAY to toggle it.
            // Pointer Lock keeps the cursor logically centered while raw mouse deltas move the player through world space.
            const TEST_MOVE = {
                enabled: false,
                dx: 0,
                dy: 0,
                sensitivity: 1.0
            };

            // Lens / Newton Rings continuation. The player's current RELATIVE PHASE is captured at the chamber.
            // The optical source wavelength itself stays fixed for the Newton-ring measurement stage.
            const SOURCE_LAMBDA = 550;
            let lensTransitionTimer = 0;
            let samplePhase = Math.PI / 2;
            let sampleIntensity = 0.5;
            let measurementIntroTimer = 0;
            let measurementResultTimer = 0;
            let measurementStep = 0;
            let reticleX = 800;
            let reticleVX = 0;
            let shotPulse = 0;
            let missTimer = 0;
            let missCountForStep = 0;
            let fringeHintTimer = 0;
            let lockFeedbackTimer = 0;
            let lockFeedbackText = '';
            const measurementMarkers = [];
            const MEASURE = {
                cx: 800, cy: 405, axisMin: 330, axisMax: 1270,
                i: 2, k: 4, referenceLambda: 550, ringScale: 118,
                reticleSpeed: 560, tolerance: 24
            };

            const CFG = {
                playerW: 38,
                playerH: 64,
                maxSpeed: 360,          // slightly tuned above brief value so signature gap is viable
                groundAccel: 2300,
                airAccel: 1600,
                groundDecel: 2800,
                gravity: 1650,
                jumpVel: -820,          // tuned so the final climb is physically completable
                maxFall: 1050,
                coyote: 0.10,
                jumpBuffer: 0.12,
                phaseSpeed: 2.75,        // rad/s; half-cycle BRIGHT -> DARK takes ~1.14 s, and tuning loops forever
            };

            const player = {
                x: 150, y: 780 - CFG.playerH, w: CFG.playerW, h: CFG.playerH,
                vx: 0, vy: 0,
                grounded: false,
                groundedOn: null,
                coyote: 0,
                jumpBuffer: 0,
                phase: Math.PI / 2,
                intensity: 0.5,
                state: 'TUNING',
                facing: 1,
                ghost: new Set(),
                trail: [],
                respawnX: 150,
                respawnFeet: 780,
                respawnPhase: Math.PI / 2,
            };

            const camera = { x: 0, y: 235, zoom: 1, targetZoom: 1 };
            let tunerPanelX = (V.w - 500) / 2;

            let nextId = 1;
            const terrain = [];
            let checkpoints = [];
            let activeCheckpoint = 0;
            let grayLift = null;
            let hardExitPlatform = null;
            let hardPortal = null;
            const movingPlatforms = [];
            const newtonRails = [];
            let newtonVestibule = null;
            let newtonMeasurementStarted = false;
            let newtonMeasurementStep = 0;
            let newtonRevealTimer = 0;
            let newtonFeedbackTimer = 0;
            let newtonFeedbackText = '';
            let newtonMissCount = 0;
            let newtonShotPulse = 0;
            const newtonMarkers = [];
            // EASY Newton finale: two horizontal platforms orbit the prescribed dark fringes.
            // The player chooses K; that choice fixes the K-O axis and therefore I and K'.
            let newtonOrbitClock = 0;
            let easyNewtonAxisAngle = null;
            let easyNewtonAxisLockedAt = 0;
            let hardNewtonAxisLockedAt = 0;

            // HARD-only living hazard: a hidden interference maw periodically bites a wedge
            // out of the Newton field. The sequence is deterministic so players can learn it.
            const HARD_NEWTON_BITE = {
                cycle: 5.8,
                warning: 1.05,
                lunge: .34,
                hold: .34,
                retreat: .46,
                halfAngle: .205,
                angles: [0.12 * Math.PI, 0.30 * Math.PI]
            };
            function angleDelta(a, b) {
                let d = (a - b) % (Math.PI * 2);
                if (d > Math.PI) d -= Math.PI * 2;
                if (d < -Math.PI) d += Math.PI * 2;
                return d;
            }
            function hardNewtonBiteState() {
                const cfg = LEVEL_MEASURE.HARD;
                const cycle = HARD_NEWTON_BITE.cycle;
                const index = Math.floor(newtonOrbitClock / cycle);
                const local = newtonOrbitClock - index * cycle;
                const angle = HARD_NEWTON_BITE.angles[index % HARD_NEWTON_BITE.angles.length];
                const w = HARD_NEWTON_BITE.warning, l = HARD_NEWTON_BITE.lunge, h = HARD_NEWTON_BITE.hold, r = HARD_NEWTON_BITE.retreat;
                let depth = 0, stage = 'REST';
                if (local < w) { stage = 'WARNING'; depth = 0; }
                else if (local < w + l) { stage = 'LUNGE'; depth = smooth(5, (local - w) / l); }
                else if (local < w + l + h) { stage = 'BITE'; depth = 1; }
                else if (local < w + l + h + r) { stage = 'RETREAT'; depth = 1 - smooth(5, (local - w - l - h) / r); }
                const t = newtonTargets(cfg);
                const outer = darkRingRadiusWorld(cfg.outerN + .65, cfg) + 76;
                const inner = t.ri - 52;
                const currentInner = lerp(outer + 68, inner, clamp(depth, 0, 1));
                return {
                    cfg, index, local, angle, depth, stage, outer, inner, currentInner,
                    lethal: local >= w + l * .55 && local <= w + l + h + r * .30
                };
            }
            // Integrated Newton measurement apparatus at the END of each playable level.
            // Each level gets one different exercise and a different physical display size.
            const LEVEL_MEASURE = {
                EASY: { cx: 6200, cy: 560, ringScale: 220, tolerance: 30, Rmm: 855, revealDuration: 5.6, i: 2, k: 4, outerN: 7, worldW: 7050, label: 'BÀI ĐO A' },
                HARD: { cx: 6600, cy: 520, ringScale: 220, tolerance: 22, Rmm: 855, revealDuration: 5.6, i: 3, k: 6, outerN: 7, worldW: 7350, label: 'BÀI ĐO B' }
            };
            function levelMeasureConfig() { return LEVEL_MEASURE[selectedLevel] || LEVEL_MEASURE.EASY; }

            const add = (name, material, x, y, w, h, extra = {}) => {
                const c = { id: nextId++, name, material, x, y, w, h, moving: false, dx: 0, dy: 0, ...extra };
                terrain.push(c);
                if (c.moving) movingPlatforms.push(c);
                return c;
            };

            function clearLevelGeometry() {
                terrain.length = 0;
                checkpoints = [];
                nextId = 1;
                grayLift = null;
                hardExitPlatform = null;
                hardPortal = null;
                movingPlatforms.length = 0;
                newtonRails.length = 0;
                newtonVestibule = null;
            }

            function addNewtonRail(name, material, targetX, measureIndex, opts) {
                const w = opts.w, h = opts.h || 24;
                const lowCenter = opts.lowCenter;
                const highCenter = opts.highCenter;
                const y = opts.y;
                const c = add(name, material, lowCenter - w * .5, y, w, h, {
                    moving: true,
                    lowX: lowCenter - w * .5,
                    highX: highCenter - w * .5,
                    lowY: y,
                    highY: y,
                    period: opts.period,
                    phase: opts.phase || 0,
                    newtonRail: true,
                    measureIndex,
                    measureLabel: ['K', 'I', "K'"][measureIndex],
                    targetX,
                    dockX: opts.dockX,
                    aimTolerance: opts.aimTolerance || Math.max(14, w * .18)
                });
                newtonRails.push(c);
                return c;
            }

            function addNewtonOrbitRail(name, material, radius, opts = {}) {
                const cfg = opts.cfg || levelMeasureConfig();
                const w = opts.w || 140, h = opts.h || 22;
                const angle = Number.isFinite(opts.angle) ? opts.angle : Math.PI;
                const cx = cfg.cx + Math.cos(angle) * radius;
                const cy = cfg.cy + Math.sin(angle) * radius;
                const c = add(name, material, cx - w * .5, cy - h * .5, w, h, {
                    moving: true,
                    newtonRail: true,
                    newtonOrbitRail: true,
                    orbitRole: opts.role || 'K',
                    orbitRadius: radius,
                    orbitAngle0: angle,
                    orbitAngle: angle,
                    period: opts.period || 9,
                    orbitDirection: opts.direction || 1,
                    orbitLabel: opts.label || '',
                    orbitLevel: opts.level || selectedLevel,
                    materialCycle: opts.materialCycle || null,
                    materialStepDuration: opts.materialStepDuration || 0,
                    materialCyclePhase: opts.materialCyclePhase || 0,
                    materialChangeIn: 999,
                    nextMaterial: null,
                });
                newtonRails.push(c);
                return c;
            }

            function addHardNewtonObstacle(name, cfg, radius, angle, w, h, kind = 'pylon') {
                const cx = cfg.cx + Math.cos(angle) * radius;
                const cy = cfg.cy + Math.sin(angle) * radius;
                return add(name, MAT.BLACK, cx - w * .5, cy - h * .5, w, h, {
                    alwaysSolid: true, structural: true, newtonObstacle: true, newtonObstacleKind: kind
                });
            }

            function setupNewtonRails(level) {
                newtonRails.length = 0;
                const cfg = LEVEL_MEASURE[level];
                const t = newtonTargets(cfg);

                if (level === 'EASY') {
                    // EASY: readable fixed-color orbits. The same k-platform is used for K and K'.
                    addNewtonOrbitRail('E_ORBIT_K', MAT.WHITE, t.rk, {
                        cfg, level: 'EASY', role: 'K', label: `k = ${cfg.k}`, w: 154, h: 22, period: 10.8, angle: Math.PI, direction: 1
                    });
                    addNewtonOrbitRail('E_ORBIT_I', MAT.GRAY, t.ri, {
                        cfg, level: 'EASY', role: 'I', label: `i = ${cfg.i}`, w: 136, h: 20, period: 8.6, angle: Math.PI * 1.30, direction: 1
                    });
                    return;
                }

                if (level === 'HARD') {
                    // HARD: opposite orbital directions, different angular speeds and deterministic
                    // material shifts. The bar itself always stays horizontal.
                    addNewtonOrbitRail('H_ORBIT_K', MAT.WHITE, t.rk, {
                        cfg, level: 'HARD', role: 'K', label: `k = ${cfg.k}`, w: 142, h: 22,
                        period: 7.15, angle: Math.PI * 1.02, direction: 1,
                        materialCycle: [MAT.WHITE, MAT.GRAY, MAT.BLACK], materialStepDuration: 3.05, materialCyclePhase: 0
                    });
                    addNewtonOrbitRail('H_ORBIT_I', MAT.GRAY, t.ri, {
                        cfg, level: 'HARD', role: 'I', label: `i = ${cfg.i}`, w: 126, h: 20,
                        period: 9.25, angle: Math.PI * 1.42, direction: -1,
                        materialCycle: [MAT.GRAY, MAT.BLACK, MAT.WHITE], materialStepDuration: 3.55, materialCyclePhase: .46
                    });

                    // Two fixed hazards with different silhouettes. The third pressure source is
                    // the animated interference maw, so the chamber stays readable rather than cluttered.
                    addHardNewtonObstacle('H_NEWTON_PRISM_TOP_LEFT', cfg, t.rk, Math.PI * 1.25, 34, 78, 'prism');
                    addHardNewtonObstacle('H_NEWTON_FORK_BOTTOM_RIGHT', cfg, (t.rk + t.ri) * .54, Math.PI * .24, 82, 34, 'fork');
                }
            }

            function setupEasyLevel() {
                WORLD.w = LEVEL_MEASURE.EASY.worldW;
                clearLevelGeometry();

                // Section I — WHITE PASS
                add('START_BLACK_FLOOR', MAT.BLACK, 0, 780, 650, 100);
                add('WHITE_WALL_01', MAT.WHITE, 650, 430, 80, 350);
                add('BLACK_SUPPORT_UNDER_WHITE', MAT.BLACK, 650, 780, 80, 100);
                add('BLACK_FLOOR_AFTER_WHITE', MAT.BLACK, 730, 780, 570, 100);

                // Section II — GRAY STEP
                add('BLACK_APPROACH_02', MAT.BLACK, 1250, 780, 300, 100);
                add('RAISED_BLACK_PLATFORM', MAT.BLACK, 1670, 700, 300, 80);
                add('GRAY_WALL_02', MAT.GRAY, 1900, 390, 70, 310);
                add('WHITE_PLATFORM_AFTER_GRAY', MAT.WHITE, 1970, 700, 360, 80);

                // Section III — BLACK PASS
                add('WHITE_FLOOR_03', MAT.WHITE, 2300, 700, 700, 80);
                add('BLACK_WALL_03', MAT.BLACK, 2600, 350, 70, 350);
                add('PRISM_TUNING_BRIDGE', MAT.BLACK, 2820, 700, 180, 80);

                // Section IV — PRISM RUN
                add('PRISM_BLACK_FLOOR', MAT.BLACK, 3000, 700, 500, 80);
                add('WHITE_GATE', MAT.WHITE, 3230, 350, 70, 350);
                add('PRISM_WHITE_FLOOR', MAT.WHITE, 3500, 700, 750, 80);
                add('GRAY_GATE', MAT.GRAY, 3750, 350, 70, 350);
                add('PRISM_GRAY_FLOOR', MAT.GRAY, 4250, 700, 450, 80);
                add('BLACK_GATE', MAT.BLACK, 4450, 350, 70, 350);

                // Section V — END MEASUREMENT APPROACH.
                // The Newton rings stay in world-space. EASY now uses two horizontal orbit platforms:
                // one on dark fringe k and one on dark fringe i. The player chooses K on the k orbit.
                add('E_END_APPROACH_FLOOR', MAT.GRAY, 4520, 700, 980, 100);
                // One clean final approach ledge. Its right edge stops before the Newton mount instead of entering the rings.
                newtonVestibule = add('E_MEASURE_VESTIBULE', MAT.BLACK, 5425, 610, 90, 30, { alwaysSolid: true, structural: true });
                setupNewtonRails('EASY');

                checkpoints = [
                    { id: 0, x: 150, feet: 780, phase: Math.PI / 2, triggerX: -1 },
                    { id: 1, x: 1260, feet: 780, phase: Math.PI / 2, triggerX: 1220 },
                    { id: 2, x: 3020, feet: 700, phase: 0, triggerX: 2960 },
                    { id: 3, x: 5450, feet: 610, phase: Math.PI / 2, zone: { x: 5400, y: 540, w: 150, h: 120 } },
                ];
            }

            function setupHardLevel() {
                WORLD.w = LEVEL_MEASURE.HARD.worldW;
                clearLevelGeometry();

                // Original hard prototype preserved as the advanced challenge.
                add('START_FLOOR', MAT.BLACK, 0, 780, 650, 100);
                add('WHITE_WALL_01', MAT.WHITE, 650, 440, 80, 340);
                add('WHITE_FLOOR_01', MAT.WHITE, 730, 780, 450, 70);
                add('SAFE_FLOOR_AFTER_01', MAT.BLACK, 1180, 780, 330, 100);

                add('APPROACH_FLOOR', MAT.BLACK, 1180, 780, 350, 100);
                grayLift = add('GRAY_LIFT', MAT.GRAY, 1530, 740, 210, 28, { moving: true, baseY: 740, lowY: 740, highY: 440, period: 6.0, phase: 0 });
                add('GRAY_PHASE_SLAB', MAT.GRAY, 1450, 320, 440, 48);
                add('UPPER_APPROACH', MAT.WHITE, 1880, 320, 260, 48);

                add('APPROACH_03', MAT.GRAY, 1900, 620, 200, 55);
                add('BLACK_SHUTTER_A', MAT.BLACK, 2100, 250, 58, 410);
                add('BLACK_ISLAND_A', MAT.BLACK, 2158, 650, 260, 55);
                add('BLACK_SHUTTER_B', MAT.BLACK, 2418, 270, 58, 390);
                add('BLACK_ISLAND_B', MAT.BLACK, 2476, 650, 260, 55);
                add('BLACK_SHUTTER_C', MAT.BLACK, 2736, 230, 58, 430);
                add('EXIT_PLATFORM_03', MAT.GRAY, 2794, 620, 500, 55);

                // Eased further: give the player a clearer ledge after the white membrane.
                // This lets them stabilize before the next phase change without killing the hard level's core idea.
                add('CONTRAST_APPROACH', MAT.GRAY, 3230, 620, 560, 55);
                add('WHITE_MEMBRANE', MAT.WHITE, 3570, 260, 70, 360);
                add('BLACK_MEMBRANE', MAT.BLACK, 3860, 250, 70, 410);
                add('BLACK_LANDING', MAT.BLACK, 3930, 660, 630, 70);

                add('BLACK_BASE', MAT.BLACK, 4400, 660, 360, 70);
                add('GRAY_CLIMB_SLAB', MAT.GRAY, 4620, 470, 370, 45);
                add('WHITE_UPPER_PLATFORM', MAT.WHITE, 4800, 315, 350, 50);
                add('BLACK_FINAL_MEMBRANE', MAT.BLACK, 5150, 150, 65, 340);
                hardExitPlatform = add('EXIT_PLATFORM', MAT.GRAY, 5215, 300, 300, 55);
                hardPortal = null;

                // After the existing HARD challenge, route the player onto a single clean approach path
                // that stops before the Newton disc. The rails themselves remain fully outside the fringes.
                add('H_MEASURE_DESCENT_1', MAT.BLACK, 5515, 360, 190, 26, { alwaysSolid: true, structural: true });
                add('H_MEASURE_DESCENT_2', MAT.BLACK, 5680, 440, 185, 26, { alwaysSolid: true, structural: true });
                // Final HARD ledge also stops before the Newton mount, leaving visible air between path and disc.
                newtonVestibule = add('H_MEASURE_VESTIBULE', MAT.BLACK, 5840, 520, 110, 26, { alwaysSolid: true, structural: true });
                setupNewtonRails('HARD');

                checkpoints = [
                    { id: 0, x: 150, feet: 780, phase: Math.PI / 2, triggerX: -1 },
                    { id: 1, x: 1280, feet: 780, phase: Math.PI / 2, triggerX: 1245 },
                    { id: 2, x: 3280, feet: 620, phase: 0, triggerX: 3220 },
                    { id: 3, x: 4440, feet: 660, phase: Math.PI / 2, triggerX: 4410 },
                    // Điểm lưu ngay trên bậc giữa trước vùng vân Newton (H_MEASURE_DESCENT_2).
                    // Chỉ cần đi qua đoạn này là chắc chắn lưu; chết trong K → I → K′ sẽ quay lại đây.
                    { id: 4, x: 5735, feet: 440, phase: Math.PI / 2, triggerX: 5685, resetNewton: true },
                ];
            }

            function setupLevel(level) {
                if (level === 'HARD') setupHardLevel();
                else setupEasyLevel();
                activeCheckpoint = 0;
            }

            // ------------------------------------------------------------
            // Math / optical state
            // ------------------------------------------------------------
            const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
            const lerp = (a, b, t) => a + (b - a) * t;
            const approach = (v, target, amount) => v < target ? Math.min(target, v + amount) : Math.max(target, v - amount);
            const smooth = (rate, dt) => 1 - Math.exp(-rate * dt);

            const TAU = Math.PI * 2;
            function wrapPhase(phi) {
                phi %= TAU;
                return phi < 0 ? phi + TAU : phi;
            }
            function intensityForPhase(phase) {
                return clamp((1 + Math.cos(phase)) / 2, 0, 1);
            }
            function stateFor(I) {
                if (I >= 0.78) return 'BRIGHT';
                if (I <= 0.22) return 'DARK';
                return 'TUNING';
            }
            function matches(material, I = player.intensity) {
                if (material === MAT.WHITE) return I >= 0.78;
                if (material === MAT.BLACK) return I <= 0.22;
                // GRAY is no longer a third stable state. It represents the continuous tuning regions between extrema.
                return I > 0.22 && I < 0.78;
            }
            function reactStrength(material, I = player.intensity) {
                if (material === MAT.WHITE) return clamp((I - 0.62) / (0.78 - 0.62), 0, 1);
                if (material === MAT.BLACK) return clamp((0.38 - I) / (0.38 - 0.22), 0, 1);
                // Gray reacts throughout the in-between tuning band, with a short visual lead-in near each boundary.
                return clamp(Math.min((I - 0.16) / 0.06, (0.84 - I) / 0.06), 0, 1);
            }
            function grayForIntensity(I, alpha = 1, min = 18, max = 245) {
                const v = Math.round(lerp(min, max, clamp(I, 0, 1)));
                return `rgba(${v},${v},${v},${alpha})`;
            }
            function stateVisual(state = player.state) {
                if (state === 'BRIGHT') return { label: 'SÁNG', relation: 'CÙNG PHA', fill: '#f4f7f8', text: '#071019', edge: '#ffffff' };
                if (state === 'DARK') return { label: 'TỐI', relation: 'NGƯỢC PHA', fill: '#0a0e13', text: '#eef3f6', edge: '#b8c2c9' };
                return { label: 'ĐIỀU PHA', relation: 'ĐANG LỆCH PHA', fill: '#596168', text: '#ffffff', edge: '#d1d8dc' };
            }

            // ------------------------------------------------------------
            // Input / console diagnostics
            // ------------------------------------------------------------
            const CONSOLE_DEBUG = true;
            function consoleEvent(type, data = {}) {
                if (!CONSOLE_DEBUG) return;
                const snapshot = {
                    state: gameState,
                    level: selectedLevel,
                    testMode: TEST_MOVE.enabled,
                    player: { x: +player.x.toFixed(1), y: +player.y.toFixed(1), vx: +player.vx.toFixed(1), vy: +player.vy.toFixed(1) },
                    ...data
                };
                console.log(`[CONTRAST][${type}]`, snapshot);
            }
            console.info('[CONTRAST] Console diagnostics enabled · filter with: CONTRAST');

            const prevent = new Set(['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space']);
            window.addEventListener('keydown', e => {
                consoleEvent('KEY_DOWN', { code: e.code, key: e.key, repeat: e.repeat, ctrl: e.ctrlKey, alt: e.altKey, shift: e.shiftKey, meta: e.metaKey });
                if (prevent.has(e.code)) e.preventDefault();
                if (!keys.has(e.code)) pressed.add(e.code);
                keys.add(e.code);
                ensureAudio();

                if (e.code === 'KeyH' && !e.repeat && gameState !== 'LEVEL_SELECT') {
                    debug = !debug;
                    consoleEvent('DEBUG_OVERLAY', { enabled: debug });
                }

                // T toggles mouse-driven test/free-move mode. No physics or collision runs while active.
                if (e.code === 'KeyT' && !e.repeat && gameState === 'PLAY') {
                    setTestMode(!TEST_MOVE.enabled);
                    pressed.delete('KeyT');
                    keys.delete('KeyT');
                    return;
                }

                if (gameState === 'LEVEL_SELECT' && !e.repeat) {
                    if (e.code === 'ArrowLeft' || e.code === 'KeyA' || e.code === 'ArrowUp' || e.code === 'KeyW') menuIndex = (menuIndex + 1) % 2;
                    if (e.code === 'ArrowRight' || e.code === 'KeyD' || e.code === 'ArrowDown' || e.code === 'KeyS') menuIndex = (menuIndex + 1) % 2;
                    if (e.code === 'Enter' || e.code === 'Space') startLevel(menuIndexToLevel(menuIndex));
                    return;
                }

                if (e.code === 'Escape' && TEST_MOVE.enabled) {
                    setTestMode(false);
                    return;

            function fireNewtonMeasurementPulse() {

            }

            function materialBase(c) {
                if (c.material === MAT.WHITE) return ['#e8f0f4', '#cfdde5'];
                if (c.material === MAT.GRAY) return ['#7d858f', '#646d78'];
                return ['#151d28', '#0d141f'];
            }
            function drawTerrain(c) {
                if (!onScreen(c)) return;
                const x = worldToScreenX(c.x), y = worldToScreenY(c.y), w = c.w * camera.zoom, h = c.h * camera.zoom;
                if (c.newtonRail && !c.newtonOrbitRail) {
                    ctx.save();
                    clipOutsideNewtonDisc(6);
                }
                if (c.newtonObstacle) {
                    ctx.save();
                    const pulse = .5 + .5 * Math.sin(elapsed * 4.6 + c.id);
                    const kind = c.newtonObstacleKind || 'pylon';
                    ctx.translate(x + w * .5, y + h * .5);

                    if (kind === 'prism') {
                        // Split optical prism: tapered silhouette + bright interference slit.
                        ctx.fillStyle = 'rgba(13,19,27,.94)';
                        ctx.beginPath();
                        ctx.moveTo(-w * .46, h * .48); ctx.lineTo(-w * .30, -h * .38); ctx.lineTo(0, -h * .50);
                        ctx.lineTo(w * .30, -h * .38); ctx.lineTo(w * .46, h * .48); ctx.closePath(); ctx.fill();
                        ctx.strokeStyle = `rgba(229,238,242,${.40 + .30 * pulse})`; ctx.lineWidth = 1.5; ctx.stroke();
                        ctx.globalAlpha = .72; ctx.fillStyle = 'rgba(236,243,246,.86)';
                        ctx.fillRect(-2.1 * camera.zoom, -h * .28, 4.2 * camera.zoom, h * .60);
                        ctx.globalAlpha = .24; ctx.strokeStyle = '#dfe8ed'; ctx.lineWidth = 1;
                        ctx.beginPath(); ctx.moveTo(-w * .28, h * .22); ctx.lineTo(0, -h * .24); ctx.lineTo(w * .28, h * .22); ctx.stroke();
                    } else {
                        // Interference fork: two jaws leave a readable central notch instead of another box.
                        ctx.fillStyle = 'rgba(14,21,30,.95)'; ctx.strokeStyle = `rgba(226,235,240,${.36 + .28 * pulse})`; ctx.lineWidth = 1.4;
                        const tooth = w * .17;
                        ctx.beginPath();
                        ctx.moveTo(-w * .48, h * .42); ctx.lineTo(-w * .48, -h * .38); ctx.lineTo(-tooth, -h * .38);
                        ctx.lineTo(-tooth * .52, -h * .05); ctx.lineTo(-tooth, h * .38); ctx.closePath(); ctx.fill(); ctx.stroke();
                        ctx.beginPath();
                        ctx.moveTo(w * .48, h * .42); ctx.lineTo(w * .48, -h * .38); ctx.lineTo(tooth, -h * .38);
                        ctx.lineTo(tooth * .52, -h * .05); ctx.lineTo(tooth, h * .38); ctx.closePath(); ctx.fill(); ctx.stroke();
                        ctx.globalAlpha = .66; ctx.strokeStyle = 'rgba(239,244,247,.86)'; ctx.lineWidth = 1.2;
                        ctx.beginPath(); ctx.moveTo(-w * .12, 0); ctx.lineTo(w * .12, 0); ctx.stroke();
                        ctx.globalAlpha = .28; ctx.beginPath(); ctx.arc(0, 0, w * .20, 0, TAU); ctx.stroke();
                    }
                    ctx.restore();
                    return;
                }
                if (c.structural) {
                    ctx.save();
                    const g = ctx.createLinearGradient(x, y, x, y + h);
                    g.addColorStop(0, '#28323b'); g.addColorStop(1, '#151c24');
                    ctx.fillStyle = g; ctx.fillRect(x, y, w, h);
                    ctx.strokeStyle = 'rgba(213,225,232,.48)'; ctx.lineWidth = 1.2; ctx.strokeRect(x + .6, y + .6, w - 1.2, h - 1.2);
                    ctx.globalAlpha = .22; ctx.strokeStyle = '#dfe8ed'; ctx.lineWidth = 1;
                    for (let px = x + 16; px < x + w; px += 42) { ctx.beginPath(); ctx.moveTo(px, y + 4); ctx.lineTo(px + 18, y + h - 4); ctx.stroke(); }
                    ctx.globalAlpha = .48; ctx.fillStyle = 'rgba(230,238,243,.65)';
                    for (let px = x + 18; px < x + w; px += 80)ctx.fillRect(px, y + 5, 3, 3);
                    ctx.restore();
                    if (c.newtonRail && !c.newtonOrbitRail) ctx.restore();
                    return;
                }
                const distX = Math.abs((player.x + player.w / 2) - (c.x + c.w / 2));
                const local = clamp(1 - distX / 470, 0, 1);
                const react = reactStrength(c.material) * local;
                const full = matches(c.material) && local > 0.02;
                const [a, b] = materialBase(c);

                ctx.save();
                // IMPORTANT: matching a material must never dim, tint, or recolor its base surface.
                // Collision state changes, but WHITE stays white, GRAY stays gray, and BLACK stays black.
                ctx.globalAlpha = 1;
                const grad = ctx.createLinearGradient(x, y, x, y + h);
                grad.addColorStop(0, a); grad.addColorStop(1, b); ctx.fillStyle = grad;
                ctx.fillRect(x, y, w, h);

                // Keep each material's normal texture completely stable regardless of match state.
                if (c.material === MAT.WHITE) {
                    ctx.globalAlpha = .18; ctx.fillStyle = '#fff';
                    for (let px = x + 12; px < x + w; px += 34) { const py = y + 8 + ((px * .37) % Math.max(12, h - 12)); ctx.fillRect(px, py, 1.5, 1.5); }
                    ctx.globalAlpha = .65; ctx.strokeStyle = '#f8ffff'; ctx.lineWidth = 1.5; ctx.strokeRect(x + .75, y + .75, w - 1.5, h - 1.5);
                } else if (c.material === MAT.GRAY) {
                    ctx.globalAlpha = .14; ctx.strokeStyle = '#d9e0e7'; ctx.lineWidth = 1;
                    const step = 24; for (let d = -h; d < w; d += step) { ctx.beginPath(); ctx.moveTo(x + d, y + h); ctx.lineTo(x + d + h, y); ctx.stroke(); }
                    ctx.globalAlpha = .4; ctx.strokeStyle = '#c4ccd5'; ctx.strokeRect(x + .5, y + .5, w - 1, h - 1);
                } else {
                    ctx.globalAlpha = .22; ctx.strokeStyle = '#526173'; ctx.lineWidth = 1.2; ctx.strokeRect(x + 1, y + 1, w - 2, h - 2);
                    ctx.globalAlpha = .11; ctx.fillStyle = '#8fa0b2';
                    for (let px = x + 15; px < x + w; px += 43) ctx.fillRect(px, y + Math.abs(Math.sin(px * .13)) * Math.max(2, h - 3), 7, 1);

                // It never changes the material's fill alpha, hue, or brightness.

                if (c.newtonOrbitRail) {
                    ctx.save();
                    ctx.textAlign = 'center';
                    ctx.font = '800 11px ui-sans-serif,system-ui';
                    ctx.fillStyle = 'rgba(239,245,248,.92)';
                    ctx.shadowBlur = 8; ctx.shadowColor = 'rgba(0,0,0,.8)';
                    ctx.fillText(c.orbitLabel, x + w * .5, y - 9);
                    ctx.shadowBlur = 0;
                    if (selectedLevel === 'HARD' && c.materialChangeIn < .55) {
                        const p = .5 + .5 * Math.sin(elapsed * 18);
                        ctx.globalAlpha = .45 + .45 * p; ctx.strokeStyle = '#f1f5f7'; ctx.lineWidth = 2;
                        ctx.strokeRect(x - 4, y - 4, w + 8, h + 8);
                        ctx.globalAlpha = .82; ctx.font = '800 9px ui-sans-serif,system-ui'; ctx.fillStyle = '#edf3f6';
                        ctx.fillText('ĐỔI PHA', x + w * .5, y - 22);
                    }
                    ctx.restore();
                }
                if (c.newtonRail && !c.newtonOrbitRail) ctx.restore();
            }

            function drawLensChamber() {
                const cx = worldToScreenX(5200), cy = worldToScreenY(410), r = 125 * camera.zoom;
                if (cx + r < 0 || cx - r > V.w) return;
                ctx.save();
                // Quiet chamber framing.
                const floorY = worldToScreenY(700);
                ctx.globalAlpha = .16; ctx.strokeStyle = '#b9c7d1'; ctx.lineWidth = 1;
                ctx.beginPath(); ctx.moveTo(cx - 360 * camera.zoom, floorY - 310 * camera.zoom); ctx.lineTo(cx - 360 * camera.zoom, floorY); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(cx + 360 * camera.zoom, floorY - 310 * camera.zoom); ctx.lineTo(cx + 360 * camera.zoom, floorY); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(cx, floorY - 420 * camera.zoom); ctx.lineTo(cx, floorY + 15); ctx.stroke();

                // Optical mount.
                ctx.globalAlpha = .55; ctx.strokeStyle = '#8d9aa4'; ctx.lineWidth = 4 * camera.zoom;
                ctx.beginPath(); ctx.arc(cx, cy, r + 24 * camera.zoom, 0, Math.PI * 2); ctx.stroke();
                ctx.globalAlpha = .32; ctx.lineWidth = 2 * camera.zoom;
                ctx.beginPath(); ctx.arc(cx, cy, r + 10 * camera.zoom, 0, Math.PI * 2); ctx.stroke();

                // Glass disc and concentric optical structure.
                const g = ctx.createRadialGradient(cx - r * .22, cy - r * .25, r * .08, cx, cy, r);
                g.addColorStop(0, 'rgba(238,245,248,.18)'); g.addColorStop(.55, 'rgba(142,158,169,.09)'); g.addColorStop(1, 'rgba(20,27,35,.24)');
                ctx.globalAlpha = 1; ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
                ctx.shadowBlur = 24; ctx.shadowColor = 'rgba(230,240,245,.22)';
                for (let q = .28; q <= 1; q += .18) { ctx.globalAlpha = .18; ctx.strokeStyle = '#e8eef1'; ctx.lineWidth = 1.1; ctx.beginPath(); ctx.arc(cx, cy, r * q, 0, Math.PI * 2); ctx.stroke(); }
                ctx.shadowBlur = 0;

                // Decorative sample pedestal around world x=5050.
                const px = worldToScreenX(5050), py = worldToScreenY(700);
                ctx.globalAlpha = .72; ctx.fillStyle = '#25303a'; ctx.fillRect(px - 34 * camera.zoom, py - 38 * camera.zoom, 68 * camera.zoom, 38 * camera.zoom);
                ctx.strokeStyle = '#aebbc4'; ctx.lineWidth = 1; ctx.strokeRect(px - 34 * camera.zoom, py - 38 * camera.zoom, 68 * camera.zoom, 38 * camera.zoom);
                ctx.globalAlpha = .62; ctx.fillStyle = '#d9e1e5'; ctx.fillRect(px - 16 * camera.zoom, py - 44 * camera.zoom, 32 * camera.zoom, 5 * camera.zoom);
                ctx.restore();
            }

            function drawNewtonApparatus() {
                if (!(selectedLevel === 'EASY' || selectedLevel === 'HARD')) return;
                const cfg = levelMeasureConfig();
                const cx = worldToScreenX(cfg.cx), cy = worldToScreenY(cfg.cy);
                const maxN = cfg.outerN;
                const outerWorld = darkRingRadiusWorld(maxN + .65, cfg);
                const outer = outerWorld * camera.zoom;
                if (cx + outer < 0 || cx - outer > V.w || cy + outer < 0 || cy - outer > V.h) return;

                ctx.save();

                // Circular glass / microscope field. The rings are rendered as a CONTINUOUS
                // interference intensity field instead of a stack of outline circles.
                ctx.globalAlpha = .98;
                const fringe = ctx.createRadialGradient(cx, cy, 0, cx, cy, outer);
                const samples = 300;
                for (let j = 0; j <= samples; j++) {
                    const t = j / samples;
                    const r = t * outerWorld;
                    const order = (r / cfg.ringScale) * (r / cfg.ringScale) * (MEASURE.referenceLambda / SOURCE_LAMBDA);
                    // Reflected Newton rings: dark at integer order, bright halfway between.
                    let I = (1 - Math.cos(TAU * order)) / 2;
                    // Slightly compress highlights so it looks optical rather than like white contour lines.
                    I = Math.pow(I, .72);
                    const edgeFade = Math.pow(Math.max(0, 1 - Math.pow(t, 5)), .22);
                    const v = Math.round(7 + I * 224 * edgeFade);
                    fringe.addColorStop(t, `rgb(${v},${v},${Math.min(255, v + 3)})`);
                }
                ctx.fillStyle = fringe;
                ctx.beginPath(); ctx.arc(cx, cy, outer, 0, TAU); ctx.fill();

                // Glass vignette + faint lens reflection, preserving the monochrome language.
                const glass = ctx.createRadialGradient(cx - outer * .24, cy - outer * .28, outer * .03, cx, cy, outer);
                glass.addColorStop(0, 'rgba(255,255,255,.11)');
                glass.addColorStop(.38, 'rgba(205,222,232,.025)');
                glass.addColorStop(.82, 'rgba(7,12,18,.03)');
                glass.addColorStop(1, 'rgba(0,0,0,.36)');
                ctx.fillStyle = glass; ctx.beginPath(); ctx.arc(cx, cy, outer, 0, TAU); ctx.fill();

                // Thin physical rim only; no numbered rings, no target highlighting.
                ctx.strokeStyle = 'rgba(205,219,227,.28)'; ctx.lineWidth = Math.max(1, 1.5 * camera.zoom);
                ctx.beginPath(); ctx.arc(cx, cy, outer, 0, TAU); ctx.stroke();
                ctx.strokeStyle = 'rgba(240,247,250,.10)'; ctx.lineWidth = Math.max(1, 4 * camera.zoom);
                ctx.beginPath(); ctx.arc(cx, cy, outer - 5 * camera.zoom, 0, TAU); ctx.stroke();

                // The central reflected fringe is dark in a Newton-ring pattern. O is the only
                // pre-existing measurement reference and stays deliberately tiny.
                ctx.fillStyle = 'rgba(0,0,0,.72)'; ctx.beginPath(); ctx.arc(cx, cy, Math.max(5, 7 * camera.zoom), 0, TAU); ctx.fill();
                ctx.fillStyle = 'rgba(240,246,248,.86)'; ctx.beginPath(); ctx.arc(cx, cy, 2.4, 0, TAU); ctx.fill();
                ctx.font = '700 10px ui-sans-serif,system-ui'; ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(235,242,245,.68)'; ctx.fillText('O', cx, cy - 14);

                // Sparse mount behind the disc to make it read as a real optical apparatus.
                ctx.globalAlpha = .20; ctx.strokeStyle = '#aebdC7'; ctx.lineWidth = 2;
                const mount = outer + 20 * camera.zoom; ctx.beginPath(); ctx.arc(cx, cy, mount, 0, TAU); ctx.stroke();
                ctx.restore();
            }

            function drawEasyNewtonTarget(target, label, active, locked) {
                const x = worldToScreenX(target.x), y = worldToScreenY(target.y);
                ctx.save();
                const pulse = .5 + .5 * Math.sin(elapsed * 5.2);
                ctx.globalAlpha = locked ? .95 : (active ? .58 + .26 * pulse : .28);
                ctx.strokeStyle = '#f0f5f7'; ctx.lineWidth = active ? 1.8 : 1.1;
                if (!locked) ctx.setLineDash([5, 5]);
                ctx.beginPath(); ctx.arc(x, y, (active ? 12 : 9) + pulse * 2, 0, TAU); ctx.stroke(); ctx.setLineDash([]);
                ctx.beginPath(); ctx.moveTo(x - 16, y); ctx.lineTo(x + 16, y); ctx.moveTo(x, y - 16); ctx.lineTo(x, y + 16); ctx.stroke();
                ctx.fillStyle = 'rgba(242,247,249,.94)'; ctx.font = '850 12px ui-sans-serif,system-ui'; ctx.textAlign = 'center'; ctx.fillText(label, x, y - 22);
                ctx.restore();
            }

            function drawHardNewtonBiteHazard() {
                if (selectedLevel !== 'HARD' || TEST_MOVE.enabled) return;
                if (gameState !== 'PLAY' && gameState !== 'DYING') return;
                const s = hardNewtonBiteState();
                const cx = worldToScreenX(s.cfg.cx), cy = worldToScreenY(s.cfg.cy);
                const z = camera.zoom;
                const angle = s.angle;
                const ux = Math.cos(angle), uy = Math.sin(angle);
                const tx = -uy, ty = ux;
                const outer = s.outer * z;
                const inner = s.currentInner * z;
                const half = HARD_NEWTON_BITE.halfAngle;

                ctx.save();

                // Warning: a pulsing arc shows exactly which slice is about to be bitten.
                if (s.stage === 'WARNING') {
                    const p = .5 + .5 * Math.sin(elapsed * 13);
                    ctx.globalAlpha = .28 + .34 * p;
                    ctx.strokeStyle = 'rgba(245,247,248,.92)'; ctx.lineWidth = 2;
                    ctx.setLineDash([8, 8]);
                    ctx.beginPath(); ctx.arc(cx, cy, (s.outer - 22) * z, angle - half, angle + half); ctx.stroke();
                    ctx.setLineDash([]);
                    const warnR = (s.outer + 10) * z;
                    const wx = cx + ux * warnR, wy = cy + uy * warnR;
                    ctx.translate(wx, wy); ctx.rotate(angle);
                    ctx.globalAlpha = .34 + .28 * p; ctx.fillStyle = 'rgba(8,12,18,.90)';
                    ctx.beginPath(); ctx.moveTo(18 * z, -34 * z); ctx.lineTo(-18 * z, 0); ctx.lineTo(18 * z, 34 * z); ctx.closePath(); ctx.fill();
                    ctx.fillStyle = 'rgba(238,243,246,.88)'; ctx.beginPath(); ctx.arc(5 * z, -9 * z, 2.8 * z, 0, TAU); ctx.fill();
                    ctx.restore();
                    return;
                }

                if (s.depth <= .01) { ctx.restore(); return; }

                // The maw comes from outside the rings and closes over a wedge like taking a bite from a cake.
                const jawBase = (s.outer + 78) * z;
                const jawTip = inner;
                const mouthHalf = Math.max(24 * z, Math.tan(half) * jawTip);
                const baseHalf = Math.max(48 * z, Math.tan(half) * jawBase * 1.02);
                const tipX = cx + ux * jawTip, tipY = cy + uy * jawTip;
                const baseX = cx + ux * jawBase, baseY = cy + uy * jawBase;

                ctx.shadowBlur = 18 * z; ctx.shadowColor = 'rgba(0,0,0,.70)';
                const jawAlpha = .78 + .18 * s.depth;
                ctx.fillStyle = `rgba(5,9,14,${jawAlpha})`;
                ctx.strokeStyle = 'rgba(218,229,235,.42)'; ctx.lineWidth = 1.5;

                // Upper jaw.
                ctx.beginPath();
                ctx.moveTo(baseX + tx * baseHalf, baseY + ty * baseHalf);
                ctx.lineTo(baseX - tx * 4 * z, baseY - ty * 4 * z);
                ctx.lineTo(tipX - tx * 7 * z, tipY - ty * 7 * z);
                ctx.lineTo(tipX + tx * mouthHalf, tipY + ty * mouthHalf);
                ctx.closePath(); ctx.fill(); ctx.stroke();
                // Lower jaw.
                ctx.beginPath();
                ctx.moveTo(baseX - tx * baseHalf, baseY - ty * baseHalf);
                ctx.lineTo(baseX + tx * 4 * z, baseY + ty * 4 * z);
                ctx.lineTo(tipX + tx * 7 * z, tipY + ty * 7 * z);
                ctx.lineTo(tipX - tx * mouthHalf, tipY - ty * mouthHalf);
                ctx.closePath(); ctx.fill(); ctx.stroke();

                // Small teeth make the silhouette read as a mouth without turning it into a cartoon character.
                ctx.shadowBlur = 0; ctx.fillStyle = 'rgba(226,235,240,.82)';
                for (let i = -2; i <= 2; i++) {
                    const f = (i + 2) / 4;
                    const rr = lerp(jawTip + 18 * z, jawBase - 30 * z, f);
                    const midX = cx + ux * rr, midY = cy + uy * rr;
                    const spread = lerp(mouthHalf * .68, baseHalf * .46, f);
                    const tooth = 7 * z;
                    for (const sign of [-1, 1]) {
                        const qx = midX + tx * spread * sign, qy = midY + ty * spread * sign;
                        ctx.beginPath();
                        ctx.moveTo(qx, qy); ctx.lineTo(qx - ux * tooth + tx * 4 * z * sign, qy - uy * tooth + ty * 4 * z * sign);
                        ctx.lineTo(qx - ux * tooth - tx * 4 * z * sign, qy - uy * tooth - ty * 4 * z * sign); ctx.closePath(); ctx.fill();
                    }
                }

                if (s.stage === 'BITE') {
                    const flash = .45 + .45 * Math.sin(elapsed * 24);
                    ctx.globalAlpha = .22 * flash; ctx.fillStyle = '#eef4f7';
                    ctx.beginPath(); ctx.arc(cx, cy, (s.inner + 18) * z, angle - half * .82, angle + half * .82); ctx.lineTo(cx, cy); ctx.closePath(); ctx.fill();
                }
                ctx.restore();
            }

            function drawNewtonMeasurementLayer() {
                if (!(selectedLevel === 'EASY' || selectedLevel === 'HARD')) return;
                const cfg = levelMeasureConfig();
                ctx.save();

                const hasOrbit = newtonRails.some(c => c.newtonOrbitRail);
                if (hasOrbit) {
                    const K = newtonMarker('K');
                    const I = newtonMarker('I');
                    const Kp = newtonMarker("K'");
                    const geo = selectedLevel === 'HARD' ? hardNewtonGeometry() : easyNewtonGeometry();

                    if (geo) {
                        // K fixes one diameter through O. I and K' are fixed geometric intersections;
                        // only the platforms continue to move.
                        const outer = darkRingRadiusWorld(cfg.outerN + .65, cfg) + 10;
                        const ax1 = { x: cfg.cx + geo.ux * outer, y: cfg.cy + geo.uy * outer };
                        const ax2 = { x: cfg.cx - geo.ux * outer, y: cfg.cy - geo.uy * outer };
                        const p1 = { x: worldToScreenX(ax1.x), y: worldToScreenY(ax1.y) };
                        const p2 = { x: worldToScreenX(ax2.x), y: worldToScreenY(ax2.y) };
                        const lockedAt = selectedLevel === 'HARD' ? hardNewtonAxisLockedAt : easyNewtonAxisLockedAt;
                        const lockAge = Math.max(0, elapsed - lockedAt);
                        const sweep = clamp(lockAge / (selectedLevel === 'HARD' ? .34 : .42), 0, 1);
                        const sx = lerp(worldToScreenX(cfg.cx), p2.x, sweep), sy = lerp(worldToScreenY(cfg.cy), p2.y, sweep);
                        ctx.strokeStyle = selectedLevel === 'HARD' ? 'rgba(244,248,250,.70)' : 'rgba(239,245,248,.55)';
                        ctx.lineWidth = selectedLevel === 'HARD' ? 1.7 : 1.35; ctx.setLineDash([8, 7]);
                        ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(sx, sy); ctx.stroke(); ctx.setLineDash([]);

                        drawEasyNewtonTarget(geo.I, 'I', newtonMeasurementStep === 1, !!I);
                        drawEasyNewtonTarget(geo.Kp, "K′", newtonMeasurementStep === 2, !!Kp);
                    }

                    for (const m of newtonMarkers) {
                        if (!Number.isFinite(m.x) || !Number.isFinite(m.y)) continue;
                        const x = worldToScreenX(m.x), y = worldToScreenY(m.y);
                        ctx.shadowBlur = selectedLevel === 'HARD' ? 20 : 15; ctx.shadowColor = 'rgba(244,248,250,.52)'; ctx.fillStyle = '#f5f8fa';
                        ctx.beginPath(); ctx.arc(x, y, 5, 0, TAU); ctx.fill(); ctx.shadowBlur = 0;
                        ctx.strokeStyle = 'rgba(242,247,249,.88)'; ctx.lineWidth = 1.4;
                        ctx.beginPath(); ctx.arc(x, y, 10, 0, TAU); ctx.stroke();
                        ctx.fillStyle = '#f4f7f9'; ctx.font = '900 12px ui-sans-serif,system-ui'; ctx.textAlign = 'center'; ctx.fillText(m.label.replace("'", "′"), x, y - 18);
                    }

                    ctx.restore();
                    return;
                }

                ctx.restore();
            }

            function newtonObjective() {
                const cfg = levelMeasureConfig();
                if (selectedLevel === 'EASY') {
                    if (newtonMeasurementStep === 0) return [`CHỌN K TRÊN VÂN k = ${cfg.k}`, 'Đứng trên thanh k · X để khóa K'];
                    if (newtonMeasurementStep === 1) return [`TÌM I TRÊN VÂN i = ${cfg.i}`, 'Nhảy sang thanh i · canh đúng trục K–O · X'];
                    if (newtonMeasurementStep === 2) return [`TÌM K′ TRÊN VÂN k = ${cfg.k}`, 'Trở lại thanh k · canh phía đối diện K · X'];
                    return ['ĐÃ ĐỦ K · I · K′', 'Đang tính B, b và bước sóng λ'];
                }
                const bite = hardNewtonBiteState();
                const hazard = bite.stage === 'WARNING' ? ' · CẢNH BÁO: MÕM NHIỄU SẮP ĐỚP' : '';
                if (newtonMeasurementStep === 0) return [`CHỌN K TRÊN VÂN k = ${cfg.k}`, `Thanh k đổi pha · chọn hướng đo rồi X${hazard}`];

                waveRow(yA, 0, 'rgba(246,249,250,.94)', 2.1);
                waveRow(yB, phase, 'rgba(157,171,181,.98)', 2.1);

                // Compact status only; the waveform alignment remains the primary readout.
                const sv = stateVisual();
                const sx = x + 378, sy = y + 34, sw = 100, sh = 62;
                ctx.shadowBlur = player.state === 'BRIGHT' ? 14 : player.state === 'DARK' ? 3 : 7; ctx.shadowColor = 'rgba(255,255,255,.30)';

                ctx.fillStyle = sv.text; ctx.textAlign = 'center'; ctx.font = '800 14px ui-sans-serif,system-ui'; ctx.fillText(sv.label, sx + sw / 2, sy + 27);
                ctx.font = '700 7.5px ui-sans-serif,system-ui'; ctx.globalAlpha = .68; ctx.fillText(sv.relation, sx + sw / 2, sy + 45); ctx.globalAlpha = 1;

                // Tiny cyclic strip with a continuous ombre that still makes the next dark/bright zone readable.
                // It is derived from the SAME phase->intensity->state logic as gameplay,
                // so the tone under the marker always matches the actual player state.
                const bx = x + 112, by = y + 114, bw = 210, bh = 12;
                const marker = bx + bw / 2;
                const pxPerCycle = 112;
                function stripColorForPhase(localPhase) {
                    const I = intensityForPhase(localPhase);
                    const s = stateFor(I);
                    // Ombre brightness from interference intensity.
                    let v = Math.round(18 + I * 226);
                    let r = v, g = v, b = v;
                    // Make the tuning band read more clearly by tinting it slightly blue-gray and lifting it a bit.
                    if (s === 'TUNING') {
                        r = Math.round(v * 0.92 + 8);
                        g = Math.round(v * 0.95 + 10);
                        b = Math.round(v * 1.02 + 18);
                    }
                    // Give the extreme bands a cleaner feel.
                    if (s === 'BRIGHT') { r = Math.min(245, r + 6); g = Math.min(247, g + 6); b = Math.min(248, b + 6); }
                    if (s === 'DARK') { r = Math.max(10, r - 6); g = Math.max(12, g - 6); b = Math.max(14, b - 6); }

                for (let ix = 0; ix < bw; ix++) {
                    const localPhase = wrapPhase(player.phase + ((ix + 0.5 - bw / 2) / pxPerCycle) * TAU);
                    ctx.fillStyle = stripColorForPhase(localPhase);
                    ctx.fillRect(bx + ix, by, 1, bh);
                }
                // Keep soft state boundaries so it is easy to read what zone is about to turn dark or bright.
                let prevState = null;
                for (let ix = 0; ix <= bw; ix++) {
                    const probePhase = wrapPhase(player.phase + ((ix - bw / 2) / pxPerCycle) * TAU);
                    const s = stateFor(intensityForPhase(probePhase));
                    if (ix > 0 && s !== prevState) {
                        const lx = bx + ix;
                        ctx.strokeStyle = 'rgba(245,248,250,.22)'; ctx.lineWidth = 1;

                sheen.addColorStop(0, 'rgba(255,255,255,.10)');
                sheen.addColorStop(.55, 'rgba(255,255,255,.02)');
                sheen.addColorStop(1, 'rgba(0,0,0,.12)');
                ctx.fillStyle = sheen; ctx.fillRect(bx, by, bw, bh);

                ctx.strokeStyle = 'rgba(235,241,244,.18)'; ctx.lineWidth = 1; ctx.strokeRect(bx, by, bw, bh);
                ctx.strokeStyle = '#f7fafb'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(marker, by - 4); ctx.lineTo(marker, by + bh + 4); ctx.stroke();
                ctx.fillStyle = 'rgba(225,234,239,.42)'; ctx.font = '600 8px ui-sans-serif,system-ui'; ctx.textAlign = 'center'; ctx.fillText('SÁNG  ·  ĐIỀU PHA  ·  TỐI  ·  ĐIỀU PHA  ·  LẶP', bx + bw / 2, by + 24);

                ctx.textAlign = 'left'; ctx.fillStyle = 'rgba(225,234,239,.40)'; ctx.font = '650 9px ui-sans-serif,system-ui'; ctx.fillText('← / →  DỊCH SÓNG B  ·  PHA TUẦN HOÀN', x + 338, y + 122);
                ctx.restore();
            }

            function drawWorldHint() {
                const items = selectedLevel === 'HARD' ? [
                    [520, 690, 'CÙNG TRẠNG THÁI = XUYÊN QUA'],
                    [1575, 705, 'KHÁC PHA ĐỂ ĐỨNG LÊN'],
                    [3275, 565, 'TIẾP TỤC ĐỔI PHA'],
                ] : [
                    [500, 690, 'CÙNG TRẠNG THÁI = XUYÊN QUA'],
                    [1800, 620, 'ĐỔI PHA THEO VẬT LIỆU'],
                    [3070, 625, 'TIẾP TỤC ĐỔI PHA'],
                ];
                ctx.save(); ctx.font = '600 12px ui-sans-serif,system-ui'; ctx.letterSpacing = '0.15em';
                for (const [wx, wy, text] of items) { const sx = worldToScreenX(wx), sy = worldToScreenY(wy); if (sx < -200 || sx > V.w + 200) continue; ctx.fillStyle = 'rgba(200,225,245,.33)'; ctx.fillText(text, sx, sy); }
                ctx.restore();
            }

            function drawLensTransitionOverlay() {
                if (gameState !== 'LENS_TRANSITION') return;
                const t = lensTransitionTimer;
                const lensX = worldToScreenX(5200), lensY = worldToScreenY(410);
                ctx.save();
                // Early lock acknowledgement.
                const lockA = clamp(1 - Math.max(0, t - .55) / .35, 0, 1);
                if (t < .9) { ctx.globalAlpha = .9 * lockA; ctx.textAlign = 'center'; ctx.fillStyle = '#edf4f7'; ctx.font = '700 15px ui-sans-serif,system-ui'; ctx.fillText('ĐÃ KHÓA MẪU ÁNH SÁNG', 800, 165); ctx.font = '500 11px ui-monospace,monospace'; ctx.globalAlpha = .58 * lockA; ctx.fillText(`φ ${(samplePhase * 180 / Math.PI).toFixed(0)}°  ·  I ${sampleIntensity.toFixed(2)}  ·  λ ${SOURCE_LAMBDA} nm`, 800, 187); }

                // Two coherent waveform traces leave the tuner and converge on the lens.
                if (t > .35 && t < 1.35) {
                    const a = clamp((t - .35) / .22, 0, 1) * clamp((1.35 - t) / .3, 0, 1);
                    ctx.globalAlpha = .52 * a; ctx.lineWidth = 1.7;
                    const startX = 800, startY = 785;
                    const phase = samplePhase;
                    for (let wv = 0; wv < 2; wv++) {
                        ctx.strokeStyle = wv === 0 ? '#f1f5f6' : '#9da8af'; ctx.setLineDash(wv ? [7, 5] : []); ctx.beginPath();
                        for (let j = 0; j <= 70; j++) {
                            const u = j / 70, bx = lerp(startX, lensX, u), by = lerp(startY, lensY, u);
                            const nx = -(lensY - startY), ny = (lensX - startX), len = Math.hypot(nx, ny) || 1;
                            const amp = 8 * (1 - u), off = Math.sin(u * 34 + (wv ? phase : 0)) * amp;
                            const xx = bx + nx / len * off, yy = by + ny / len * off;
                            if (j === 0) ctx.moveTo(xx, yy); else ctx.lineTo(xx, yy);
                        } ctx.stroke();
                    } ctx.setLineDash([]);
                    ctx.globalAlpha = .24 * a; ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(lensX, lensY - 185); ctx.lineTo(lensX, lensY + 185); ctx.stroke();
                }

                // Fade platform world while the front-facing ring view grows in.
                const dark = clamp((t - 1.0) / .78, 0, .82);
                ctx.globalAlpha = dark; ctx.fillStyle = '#03060b'; ctx.fillRect(0, 0, V.w, V.h);
                ctx.restore();
                if (t > 1.55) {
                    const ringA = clamp((t - 1.55) / .72, 0, 1);
                    drawMeasurementBackdrop(ringA, true);
                }
            }

            function drawMeasurementBackdrop(alpha = 1, transitionOnly = false) {
                const cx = MEASURE.cx, cy = MEASURE.cy;
                ctx.save(); ctx.globalAlpha = alpha;
                const bg = ctx.createRadialGradient(cx, cy, 40, cx, cy, 650); bg.addColorStop(0, '#111923'); bg.addColorStop(.52, '#080d15'); bg.addColorStop(1, '#03060b'); ctx.fillStyle = bg; ctx.fillRect(0, 0, V.w, V.h);

                // Glass disc.
                const discR = 390;
                const glass = ctx.createRadialGradient(cx - 75, cy - 90, 25, cx, cy, discR); glass.addColorStop(0, 'rgba(235,242,245,.11)'); glass.addColorStop(.52, 'rgba(145,158,167,.07)'); glass.addColorStop(1, 'rgba(200,215,225,.025)');
                ctx.fillStyle = glass; ctx.beginPath(); ctx.arc(cx, cy, discR, 0, Math.PI * 2); ctx.fill();
                ctx.strokeStyle = 'rgba(205,218,226,.18)'; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.arc(cx, cy, discR, 0, Math.PI * 2); ctx.stroke();

                // Alternating bright and dark Newton fringes. Dark targets are the measurement references.
                ctx.shadowBlur = 14; ctx.shadowColor = 'rgba(235,243,247,.16)';
                for (let n = 0; n < 6; n++) {
                    const rb = brightRingRadius(n);
                    ctx.strokeStyle = 'rgba(230,237,241,.48)'; ctx.lineWidth = 4.5; ctx.beginPath(); ctx.arc(cx, cy, rb, 0, Math.PI * 2); ctx.stroke();
                }
                ctx.shadowBlur = 0;
                for (let n = 1; n <= 6; n++) {
                    const rd = darkRingRadius(n);
                    ctx.strokeStyle = 'rgba(0,0,0,.88)'; ctx.lineWidth = 8; ctx.beginPath(); ctx.arc(cx, cy, rd, 0, Math.PI * 2); ctx.stroke();
                    ctx.strokeStyle = 'rgba(185,198,207,.17)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(cx, cy, rd, 0, Math.PI * 2); ctx.stroke();
                }
                ctx.fillStyle = 'rgba(1,3,6,.88)'; ctx.beginPath(); ctx.arc(cx, cy, 28, 0, Math.PI * 2); ctx.fill();

                if (!transitionOnly) {
                    const introPulse = measurementIntroTimer < 1.25 ? 1 - measurementIntroTimer / 1.25 : 0;
                    const hintPulse = fringeHintTimer > 0 ? .5 + .5 * Math.sin(elapsed * 14) : 0;
                    const p = Math.max(introPulse * .7, hintPulse * .8);
                    if (p > 0) {
                        ctx.shadowBlur = 20; ctx.shadowColor = 'rgba(245,248,250,.55)'; ctx.strokeStyle = `rgba(245,248,250,${.28 + .55 * p})`; ctx.lineWidth = 2.8;
                        for (const n of [MEASURE.i, MEASURE.k]) { ctx.beginPath(); ctx.arc(cx, cy, darkRingRadius(n), 0, Math.PI * 2); ctx.stroke(); }
                        ctx.shadowBlur = 0;
                    }
                }
                ctx.restore();
            }

            function measurementObjective() {
                if (measurementStep === 0) return ['XÁC ĐỊNH K', 'GIAO ĐIỂM BÊN TRÁI CỦA VÂN k'];
                if (measurementStep === 1) return ['XÁC ĐỊNH I', 'GIAO ĐIỂM BÊN PHẢI CỦA VÂN i'];
                if (measurementStep === 2) return ["LOCATE K'", 'RIGHT CROSSING OF FRINGE k'];
                return ['ĐÃ KHÓA PHÉP ĐO', "K · I · K′"];
            }

            function drawMeasurementMarkers() {
                ctx.save(); ctx.textAlign = 'center';
                for (const m of measurementMarkers) {
                    ctx.strokeStyle = 'rgba(238,244,247,.82)'; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.moveTo(m.x, MEASURE.cy - 18); ctx.lineTo(m.x, MEASURE.cy + 18); ctx.stroke();
                    ctx.fillStyle = '#f1f5f7'; ctx.beginPath(); ctx.arc(m.x, MEASURE.cy, 4, 0, Math.PI * 2); ctx.fill();
                    ctx.fillStyle = 'rgba(238,244,247,.92)'; ctx.font = '800 13px ui-sans-serif,system-ui'; ctx.fillText(m.label, m.x, MEASURE.cy - 28);
                }
                ctx.restore();
            }

            function drawReticle() {
                const y = MEASURE.cy, shake = missTimer > 0 ? Math.sin(elapsed * 70) * 3 : 0, x = reticleX + shake;
                ctx.save(); ctx.translate(x, y); ctx.shadowBlur = 9; ctx.shadowColor = 'rgba(235,244,248,.34)'; ctx.strokeStyle = missTimer > 0 ? 'rgba(180,145,145,.9)' : 'rgba(235,243,247,.86)'; ctx.lineWidth = 1.2;
                ctx.beginPath(); ctx.moveTo(-18, 0); ctx.lineTo(-5, 0); ctx.moveTo(5, 0); ctx.lineTo(18, 0); ctx.moveTo(0, -18); ctx.lineTo(0, -5); ctx.moveTo(0, 5); ctx.lineTo(0, 18); ctx.stroke();
                ctx.rotate(Math.PI / 4); ctx.strokeRect(-3, -3, 6, 6); ctx.shadowBlur = 0; ctx.restore();
                if (shotPulse > 0) { ctx.save(); ctx.globalAlpha = shotPulse / .24; ctx.strokeStyle = '#f5f8fa'; ctx.lineWidth = 1.7; ctx.beginPath(); ctx.arc(reticleX, y, (.24 - shotPulse) * 150, 0, Math.PI * 2); ctx.stroke(); ctx.restore(); }
            }

            function drawMeasurementHUD() {
                const [title, sub] = measurementObjective();
                ctx.save();
                ctx.fillStyle = 'rgba(4,8,14,.72)'; rr(30, 28, 230, 88, 14); ctx.fill(); ctx.strokeStyle = 'rgba(205,220,230,.18)'; ctx.stroke();
                ctx.fillStyle = '#e5edf1'; ctx.font = '700 12px ui-sans-serif,system-ui'; ctx.fillText('ĐO VÂN NEWTON', 48, 54); ctx.font = '600 12px ui-monospace,monospace'; ctx.fillStyle = 'rgba(220,230,235,.70)'; ctx.fillText('i = 2', 48, 80); ctx.fillText('k = 4', 112, 80);
                ctx.textAlign = 'center'; ctx.fillStyle = '#f0f5f7'; ctx.font = '800 22px ui-sans-serif,system-ui'; ctx.fillText(title, 800, 98); ctx.font = '600 11px ui-sans-serif,system-ui'; ctx.fillStyle = 'rgba(215,225,231,.62)'; ctx.fillText(sub, 800, 119);
                if (measurementIntroTimer < 1.25) { ctx.globalAlpha = clamp(1 - measurementIntroTimer / 1.25, 0, 1); ctx.font = '700 15px ui-sans-serif,system-ui'; ctx.fillStyle = '#eef4f6'; ctx.fillText('i = 2      k = 4', 800, 154); ctx.globalAlpha = 1; }
                if (lockFeedbackTimer > 0) { ctx.globalAlpha = clamp(lockFeedbackTimer / .35, 0, 1); ctx.fillStyle = missTimer > 0 ? 'rgba(205,175,175,.85)' : 'rgba(225,235,240,.86)'; ctx.font = '700 12px ui-sans-serif,system-ui'; ctx.fillText(lockFeedbackText, 800, 690); ctx.globalAlpha = 1; }
                ctx.fillStyle = 'rgba(4,8,14,.68)'; rr(585, 812, 430, 48, 13); ctx.fill(); ctx.strokeStyle = 'rgba(205,220,230,.15)'; ctx.stroke(); ctx.fillStyle = 'rgba(229,237,241,.78)'; ctx.font = '650 12px ui-sans-serif,system-ui'; ctx.fillText('A / D   DI CHUYỂN TÂM NGẮM      SPACE   ĐO', 800, 842);
                ctx.restore();
            }

            function drawMeasurementResult() {
                if (gameState !== 'MEASUREMENT_RESULT') return;
                const t = measurementTargets(), tm = measurementResultTimer, y = MEASURE.cy + 74;
                ctx.save();
                // B = K -> I
                if (tm > .2) { const p = clamp((tm - .2) / .6, 0, 1), x2 = lerp(t.K, t.I, p); ctx.strokeStyle = 'rgba(240,245,247,.88)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(t.K, y); ctx.lineTo(x2, y); ctx.stroke(); if (p > .75) { ctx.textAlign = 'center'; ctx.fillStyle = '#eef4f6'; ctx.font = '700 13px ui-sans-serif,system-ui'; ctx.fillText('B = KI', lerp(t.K, t.I, .5), y - 10); } }
                // b = I -> K'
                if (tm > .8) { const p = clamp((tm - .8) / .6, 0, 1), x2 = lerp(t.I, t.Kp, p); ctx.strokeStyle = 'rgba(190,202,210,.80)'; ctx.lineWidth = 2; ctx.setLineDash([7, 6]); ctx.beginPath(); ctx.moveTo(t.I, y + 35); ctx.lineTo(x2, y + 35); ctx.stroke(); ctx.setLineDash([]); if (p > .75) { ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(224,232,236,.86)'; ctx.font = '700 13px ui-sans-serif,system-ui'; ctx.fillText("b = IK'", lerp(t.I, t.Kp, .5), y + 27); } }
                if (tm > 1.4) { const a = clamp((tm - 1.4) / .3, 0, 1); ctx.globalAlpha = a; ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(220,230,235,.74)'; ctx.font = '600 14px ui-sans-serif,system-ui'; ctx.fillText('B = rₖ + rᵢ      b = rₖ − rᵢ', 800, 615); ctx.font = '750 20px ui-sans-serif,system-ui'; ctx.fillStyle = '#eff4f6'; ctx.fillText('B × b = rₖ² − rᵢ²', 800, 651); }
                if (tm > 2.1) { const a = clamp((tm - 2.1) / .35, 0, 1); ctx.globalAlpha = a; ctx.textAlign = 'center'; ctx.fillStyle = '#f2f6f8'; ctx.font = '800 25px ui-sans-serif,system-ui'; ctx.fillText('ĐO HOÀN TẤT', 800, 728); }
                ctx.restore();
            }

            function drawMeasurementScene() {
                drawMeasurementBackdrop(1, false);
                ctx.save(); ctx.strokeStyle = 'rgba(210,222,229,.32)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(MEASURE.axisMin, MEASURE.cy); ctx.lineTo(MEASURE.axisMax, MEASURE.cy); ctx.stroke();
                for (let x = MEASURE.axisMin; x <= MEASURE.axisMax; x += 47) { ctx.globalAlpha = .28; ctx.beginPath(); ctx.moveTo(x, MEASURE.cy - 4); ctx.lineTo(x, MEASURE.cy + 4); ctx.stroke(); } ctx.restore();
                drawMeasurementMarkers();
                if (gameState === 'MEASUREMENT') drawReticle();
                drawMeasurementHUD();
                drawMeasurementResult();
                if (missTimer > 0) { ctx.save(); ctx.globalAlpha = missTimer * .12 / .48; ctx.fillStyle = '#6d3d42'; ctx.fillRect(0, 0, V.w, V.h); ctx.restore(); }
            }

            function drawCompletion() {
                if (gameState !== 'COMPLETE') return;
                const a = clamp(completeTimer * 2.5, 0, 1);
                ctx.save(); ctx.globalAlpha = .72 * a; ctx.fillStyle = '#03060c'; ctx.fillRect(0, 0, V.w, V.h);
                ctx.globalAlpha = a; ctx.textAlign = 'center'; ctx.shadowBlur = 28; ctx.shadowColor = 'rgba(255,255,255,.45)'; ctx.fillStyle = '#f1f7fb'; ctx.font = '700 46px ui-sans-serif,system-ui'; ctx.fillText('HOÀN THÀNH PHÉP ĐO', 800, 445); ctx.shadowBlur = 0;
                ctx.fillStyle = 'rgba(220,235,245,.72)'; ctx.font = '500 18px ui-sans-serif,system-ui';
                const completionSub = selectedLevel === 'EASY' ? 'Điều pha · Chọn điểm · Đo bước sóng.' : 'Vượt thử thách · Chọn K · Hoàn tất phép đo.';
                ctx.fillText(completionSub, 800, 485);

                ctx.fillStyle = 'rgba(20,30,42,.92)'; rr(500, 610, 285, 60, 14); ctx.fill(); ctx.strokeStyle = 'rgba(220,240,255,.30)'; ctx.stroke(); ctx.fillStyle = '#eaf4fb'; ctx.font = '650 14px ui-sans-serif,system-ui'; ctx.fillText('CHƠI LẠI  ·  ENTER', 642, 647);
                ctx.fillStyle = 'rgba(20,30,42,.92)'; rr(815, 610, 285, 60, 14); ctx.fill(); ctx.strokeStyle = 'rgba(220,240,255,.30)'; ctx.stroke(); ctx.fillStyle = '#eaf4fb'; ctx.fillText('CHỌN MÀN  ·  ESC', 958, 647);
                ctx.restore();
            }

            function drawBackToMenu() {
                if (gameState === 'LEVEL_SELECT') return;
                // Keep the back button away from the top-left control hint so they never overlap.
                const x = V.w - 166, y = 24, w = 140, h = 44;
                ctx.save();
                ctx.fillStyle = 'rgba(5,9,17,.76)'; rr(x, y, w, h, 12); ctx.fill();
                ctx.strokeStyle = 'rgba(214,229,239,.24)'; ctx.lineWidth = 1; ctx.stroke();
                ctx.fillStyle = 'rgba(236,244,249,.86)'; ctx.textAlign = 'center';
                ctx.font = '700 12px ui-sans-serif,system-ui'; ctx.fillText('←  TRÌNH ĐƠN', x + w / 2, y + 20);
                ctx.fillStyle = 'rgba(214,229,239,.38)'; ctx.font = '600 9px ui-sans-serif,system-ui'; ctx.fillText('ESC', x + w / 2, y + 34);
                ctx.restore();
            }

            function drawLevelSelect() {
                ctx.save();
                const g = ctx.createLinearGradient(0, 0, 0, V.h); g.addColorStop(0, '#07111e'); g.addColorStop(1, '#04070d'); ctx.fillStyle = g; ctx.fillRect(0, 0, V.w, V.h);

                ctx.translate(800, 420);
                for (let i = 0; i < 7; i++) { ctx.globalAlpha = .035 + i * .008; ctx.strokeStyle = '#d9e7ef'; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(0, 0, 120 + i * 64, 0, Math.PI * 2); ctx.stroke(); }
                ctx.translate(-800, -420); ctx.globalAlpha = 1;

                ctx.textAlign = 'center'; ctx.fillStyle = '#f1f6f9'; ctx.font = '800 50px ui-sans-serif,system-ui'; ctx.fillText('CONTRAST', 800, 170);
                ctx.fillStyle = 'rgba(220,232,240,.55)'; ctx.font = '600 13px ui-sans-serif,system-ui'; ctx.fillText('CHỌN MÀN CHƠI', 800, 205);

                const cards = [
                    { x: 285, y: 350, w: 490, h: 260, title: 'DỄ / VỪA', sub: 'Làm quen cơ chế + đo vân Newton', details: ['Đường đi dễ đọc', 'Sáng · Điều pha · Tối', 'Chọn K · đi theo quỹ đạo tới I và K′'] },
                    { x: 825, y: 350, w: 490, h: 260, title: 'KHÓ', sub: 'Thử thách nâng cao + đo vân Newton', details: ['Thanh di chuyển đổi màu và chạy ngược chiều', 'Có chướng ngại và mõm nhiễu', 'Chọn K hợp lý để đo I và K′'] }
                ];
                cards.forEach((c, i) => {
                    const sel = i === menuIndex;
                    ctx.fillStyle = sel ? 'rgba(28,39,51,.94)' : 'rgba(13,20,29,.83)'; rr(c.x, c.y, c.w, c.h, 22); ctx.fill();
                    ctx.strokeStyle = sel ? 'rgba(238,245,249,.72)' : 'rgba(190,210,224,.18)'; ctx.lineWidth = sel ? 2 : 1; ctx.stroke();
                    if (sel) { ctx.shadowBlur = 28; ctx.shadowColor = 'rgba(225,240,250,.14)'; ctx.strokeStyle = 'rgba(240,247,250,.28)'; ctx.stroke(); ctx.shadowBlur = 0; }
                    ctx.textAlign = 'left'; ctx.fillStyle = '#eff5f8'; ctx.font = '800 27px ui-sans-serif,system-ui'; ctx.fillText(c.title, c.x + 34, c.y + 52);
                    ctx.fillStyle = 'rgba(222,233,240,.58)'; ctx.font = '600 13px ui-sans-serif,system-ui'; ctx.fillText(c.sub, c.x + 34, c.y + 80);
                    ctx.font = '500 13px ui-sans-serif,system-ui'; ctx.fillStyle = 'rgba(220,232,240,.45)'; c.details.forEach((t, j) => ctx.fillText('— ' + t, c.x + 34, c.y + 126 + j * 32));
                    if (sel) { ctx.textAlign = 'right'; ctx.fillStyle = 'rgba(242,247,250,.82)'; ctx.font = '800 11px ui-sans-serif,system-ui'; ctx.fillText('ĐANG CHỌN', c.x + c.w - 28, c.y + 48); }
                });

                ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(220,232,240,.55)'; ctx.font = '650 12px ui-sans-serif,system-ui'; ctx.fillText('A / D HOẶC ← / →  CHỌN      ENTER / SPACE  BẮT ĐẦU', 800, 700);
                ctx.fillStyle = 'rgba(220,232,240,.30)'; ctx.font = '500 11px ui-sans-serif,system-ui'; ctx.fillText('Trong game: A / D di chuyển · Space/W nhảy · X đánh dấu · ← / → đổi pha · T chế độ thử', 800, 735);
                ctx.restore();
            }

            function draw() {
                if (gameState === 'LEVEL_SELECT') {
                    drawLevelSelect();
                    return;
                }

                // Legacy screen-space measurement states are retained only for compatibility;
                // current EASY and HARD endings use the integrated world-space apparatus.
                if (gameState === 'MEASUREMENT' || gameState === 'MEASUREMENT_RESULT') {
                    drawMeasurementScene();
                    drawDebug();
                    drawBackToMenu();
                    return;
                }

                drawBackground();
                drawNewtonApparatus();
                drawTrail();
                for (const c of terrain) drawTerrain(c);
                drawWorldHint();
                drawPlayer();
                drawHardNewtonBiteHazard();
                drawNewtonMeasurementLayer();
                drawNewtonRevealResult();
                drawDebug();

                if (gameState === 'PLAY' && (!newtonMeasurementStarted || TEST_MOVE.enabled)) drawControlHint();
                if (gameState === 'PLAY' && !TEST_MOVE.enabled) drawTuner();
                drawNewtonMeasurementHUD();

                if (checkpointFlash > 0) { ctx.save(); ctx.globalAlpha = checkpointFlash * .7; ctx.textAlign = 'center'; ctx.fillStyle = '#e9f7ff'; ctx.font = '650 13px ui-sans-serif,system-ui'; ctx.fillText('ĐÃ LƯU ĐIỂM HỒI SINH', 800, 154); ctx.restore(); }
                if (gameState === 'DYING') { const a = clamp(1 - deathTimer / .34, 0, 1); ctx.save(); ctx.globalAlpha = .18 + a * .42; ctx.fillStyle = '#02040a'; ctx.fillRect(0, 0, V.w, V.h); ctx.restore(); }
                if (screenPulse > 0) { ctx.save(); ctx.globalAlpha = screenPulse * .11; ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, V.w, V.h); ctx.restore(); }
                drawCompletion();
                drawBackToMenu();
            }

            // ------------------------------------------------------------
            // Fixed-step loop for stable collision behavior.
            // ------------------------------------------------------------
            let acc = 0; const STEP = 1 / 120;
            function frame(now) {
                const dt = Math.min(.05, (now - last) / 1000); last = now; acc += dt;
                let guard = 0;
                while (acc >= STEP && guard++ < 8) { update(STEP); acc -= STEP; }
                draw(); requestAnimationFrame(frame);
            }
            player.intensity = intensityForPhase(player.phase); player.state = stateFor(player.intensity);
            requestAnimationFrame(frame);

        })();
    </script>
